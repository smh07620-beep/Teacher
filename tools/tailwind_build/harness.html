<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script></head><body><div id="h"></div>
<script>
(async()=>{
 const toks=await (await fetch('/tokens.json')).json();
 const d=document.createElement('div'); d.className=toks.join(' '); document.getElementById('h').appendChild(d);
 await new Promise(r=>setTimeout(r,6000));
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 await fetch('/save',{method:'POST',body:css});
 document.title='done '+css.length;
})();
</script></body></html>
