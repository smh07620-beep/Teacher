              'function renderAdminUserAccounts(', 'function renderAdminPeople(',
              'function renderAdminSystemStatus(', 'function renderCategoryChart(',
              'function resetCurrentQuiz(', 'function toggleSopModal(',
              'function adminPayloadFromQuestionEditor(', 'function aiMaterialKind(',
