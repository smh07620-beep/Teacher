name: Temp final skeleton cleanup

on:
  push:
    branches:
      - cleanup/final-skeleton-orphans-20260917
    paths:
      - .github/workflows/tmp-skeleton-audit.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/final-skeleton-orphans-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited convergence cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/final_skeleton_cleanup.py')
          text = path.read_text(encoding='utf-8')
          fixes = {
              'nav = read("static/portal-navigation-73.js")ndead =': 'nav = read("static/portal-navigation-73.js")\nndead =',
              'assert header_removed == 3, ("public management header links", header_removed)': 'assert header_removed == 1, ("public management header links", header_removed)',
              'assert bottom_removed == 2, ("public direct bottom management links", bottom_removed)': 'assert bottom_removed == 1, ("public direct bottom management links", bottom_removed)',
              "self.source('teacher_app/command_center.py')": "self.source('teacher_app/command_center/routes.py')",
          }
          for old, new in fixes.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/final_skeleton_cleanup.py
      - name: Install focused test dependencies
        run: python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3' 'Pillow>=10.4,<12.0'
      - name: Syntax and focused convergence checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py smart_learning_67.py pgy_frontend.py
          for js in \
            static/system-admin.js \
            static/admin-course-material.js \
            static/admin-question-bank.js \
            static/admin-people.js \
            static/admin-system.js \
            static/admin-exam-settings.js \
            static/admin-question-actions.js \
            static/review-links-66.js \
            static/workspace-shell-70.js \
            static/portal-v56.js \
            static/portal-navigation-73.js
          do
            node --check "$js"
          done
          python -m unittest \
            tests.test_smart_learning_67 \
            tests.test_final_convergence_stage3_cleanup \
            tests.test_runtime_convergence_74 \
            tests.test_final_skeleton_cleanup_74
          git diff --check
      - name: Commit cleanup to temp branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smh07620-beep"
          git config user.email "smh07620@gmail.com"
          git add -A
          git reset -- .github/workflows/tmp-skeleton-audit.yml .github/scripts/final_skeleton_cleanup.py
          git status --short
          test -n "$(git diff --cached --name-only)"
          git commit -m "RC final skeleton cleanup and orphan convergence"
          git push origin HEAD:cleanup/final-skeleton-orphans-20260917
