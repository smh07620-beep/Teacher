name: Temp final skeleton cleanup

on:
  push:
    branches:
      - cleanup/final-skeleton-orphans-20260917
    paths:
      - .github/workflows/tmp-skeleton-audit.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/final-skeleton-orphans-20260917
          fetch-depth: 0

      - name: Apply audited convergence cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import textwrap

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def route_literal(dec):
              if not isinstance(dec, ast.Call) or not isinstance(dec.func, ast.Attribute):
                  return None
              if dec.func.attr not in {'get','post','put','patch','delete','route'}:
                  return None
              if not dec.args or not isinstance(dec.args[0], ast.Constant) or not isinstance(dec.args[0].value, str):
                  return None
              return dec.args[0].value

          def remove_python_routes(path, endpoints, named_functions=()):
              text = read(path)
              tree = ast.parse(text)
              ranges = []
              found_routes = set()
              found_names = set()
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  matched = False
                  start = node.lineno
                  for dec in node.decorator_list:
                      endpoint = route_literal(dec)
                      if endpoint in endpoints:
                          found_routes.add(endpoint)
                          start = min(start, dec.lineno)
                          matched = True
                  if node.name in named_functions:
                      found_names.add(node.name)
                      matched = True
                  if matched:
                      ranges.append((start, node.end_lineno))
              missing_routes = set(endpoints) - found_routes
              missing_names = set(named_functions) - found_names
              assert not missing_routes, (path, 'missing route definitions', sorted(missing_routes))
              assert not missing_names, (path, 'missing function definitions', sorted(missing_names))
              lines = text.splitlines(keepends=True)
              for start, end in sorted(ranges, reverse=True):
                  del lines[start-1:end]
              result = ''.join(lines)
              ast.parse(result)
              write(path, result)

          # ---- Retire true orphan backend endpoints. ----
          remove_python_routes(
              'smart_learning_67.py',
              {
                  '/api/docx-atlas-preview/<material_id>',
                  '/api/learning-analytics',
                  '/api/media-processing/capability',
              },
              {'preview_docx_atlas'},
          )
          smart = read('smart_learning_67.py')
          for symbol in ('ffmpeg_capability','libreoffice_capability','worker_architecture'):
              assert len(re.findall(rf'\b{symbol}\b', smart)) == 1, (symbol, 'still used after orphan route removal')
          smart, n = re.subn(
              r'^from media_processing_67 import ffmpeg_capability, libreoffice_capability, worker_architecture\n',
              '', smart, count=1, flags=re.M,
          )
          assert n == 1
          ast.parse(smart)
          write('smart_learning_67.py', smart)

          remove_python_routes(
              'app.py',
              {
                  '/api/groups',
                  '/api/training-areas',
                  '/api/admin/background-jobs/status',
              },
          )

          # ---- JS function ownership migration out of system-admin.js. ----
          def matching_brace(text, brace_pos):
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = brace_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i+1 < len(text) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 1
                  elif quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch == '/' and nxt == '/':
                          line_comment = True
                          i += 1
                      elif ch == '/' and nxt == '*':
                          block_comment = True
                          i += 1
                      elif ch in "'\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise AssertionError('unmatched JS brace')

          def pop_js_function(text, name):
              pat = re.compile(rf'(?m)^(?:async\s+)?function\s+{re.escape(name)}\s*\(')
              matches = list(pat.finditer(text))
              assert len(matches) == 1, (name, 'expected exactly one top-level function', len(matches))
              m = matches[0]
              brace = text.find('{', m.end())
              assert brace >= 0
              end = matching_brace(text, brace) + 1
              while end < len(text) and text[end] in '\r\n':
                  end += 1
              return text[m.start():end], text[:m.start()] + text[end:]

          def insert_before_iife_end(path, block):
              text = read(path)
              idx = text.rfind('})();')
              assert idx >= 0, (path, 'missing IIFE terminator')
              write(path, text[:idx] + block.rstrip() + '\n' + text[idx:])

          legacy = read('static/system-admin.js')
          legacy = legacy.replace(
              '/* V5.9.0 · 後台內容、題庫、帳號與系統管理 */',
              '/* Final convergence compatibility shell: shared state + DOCX fallback only. */',
              1,
          )

          move_plan = {
              'static/admin-course-material.js': [
                  'adminMaterialTypeBadge','adminHubMaterialRow','renderAdminCourseMaterialHub',
              ],
              'static/admin-question-bank.js': [
                  'setAdminQuizSyncStatus','adminHasExpandedQuestionEditor','quizCategoryCardHTML','updateQuizWorkspacePresentation',
              ],
              'static/admin-people.js': [
                  'renderAdminUserAccounts','createAdminUserAccount','renderAdminPeople',
              ],
              'static/admin-system.js': [
                  'systemStatusCard','renderAdminSystemStatus',
              ],
              'static/admin-exam-settings.js': [
                  'difficultyLabel',
              ],
          }
          moved = {}
          for target, names in move_plan.items():
              moved[target] = []
              for name in names:
                  source, legacy = pop_js_function(legacy, name)
                  moved[target].append((name, source))

          # People state belongs with the people runtime, not the legacy shell.
          people_state = "let adminUserAccountsCache=[];\nconst ADMIN_USER_AREA_LABELS={internal:'院內',pgy:'PGY'};\n"
          assert people_state in legacy
          legacy = legacy.replace(people_state, '', 1)
          people_text = read('static/admin-people.js')
          marker = "  'use strict';\n"
          assert marker in people_text
          people_text = people_text.replace(marker, marker + "\n  let adminUserAccountsCache=[];\n  const ADMIN_USER_AREA_LABELS={internal:'院內',pgy:'PGY'};\n", 1)
          write('static/admin-people.js', people_text)

          # Functions that are either fully duplicated in canonical learner modules or dead after extraction.
          for name in (
              'aiMaterialKind','_aiPickerState','_aiMaterialSearchText','adminPayloadFromQuestionEditor',
              'adminBatchQuestionPatch','renderCategoryChart','resetCurrentQuiz','toggleSopModal',
          ):
              _source, legacy = pop_js_function(legacy, name)

          for dead_decl in (
              'const questionActionBusy=new Set();\n',
              'const questionBulkBusy=new Set();\n',
              'let materialJobsRefreshTimer=null;\n',
          ):
              if dead_decl in legacy:
                  token = dead_decl.split('=')[0].split()[-1].strip()
                  assert legacy.count(token) == 1, (token, 'declaration still referenced')
                  legacy = legacy.replace(dead_decl, '', 1)

          write('static/system-admin.js', legacy)

          export_map = {
              'static/admin-course-material.js': ['adminMaterialTypeBadge','adminHubMaterialRow','renderAdminCourseMaterialHub'],
              'static/admin-question-bank.js': ['setAdminQuizSyncStatus','adminHasExpandedQuestionEditor','quizCategoryCardHTML','updateQuizWorkspacePresentation'],
              'static/admin-people.js': ['renderAdminUserAccounts','createAdminUserAccount','renderAdminPeople'],
              'static/admin-system.js': ['systemStatusCard','renderAdminSystemStatus'],
              'static/admin-exam-settings.js': ['difficultyLabel'],
          }
          for target, items in moved.items():
              code = '\n\n  // Final convergence: canonical owner migrated from system-admin.js.\n'
              for _name, source in items:
                  code += textwrap.indent(source.rstrip(), '  ') + '\n\n'
              for name in export_map[target]:
                  code += f'  window.{name}={name};\n'
              insert_before_iife_end(target, code)

          # Review-source augmentation now wraps the canonical question payload owner.
          review = read('static/review-links-66.js')
          replacements = {
              'typeof adminPayloadFromQuestionEditor': 'typeof window.adminBuildQuestionPayload',
              'adminPayloadFromQuestionEditor;': 'window.adminBuildQuestionPayload;',
              'adminPayloadFromQuestionEditor =': 'window.adminBuildQuestionPayload =',
          }
          for old, new in replacements.items():
              assert old in review, old
              review = review.replace(old, new)
          assert 'adminPayloadFromQuestionEditor' not in review
          write('static/review-links-66.js', review)

          # Ensure review-links loads after canonical question editor/actions, so wrapping is deterministic.
          frontend = read('pgy_frontend.py')
          early = "            if \"/review-links-66.js\" not in html:\n                body_assets.append('<script defer src=\"/review-links-66.js?v=6604\"></script>')\n"
          assert early in frontend
          frontend = frontend.replace(early, '', 1)
          action_marker = "            if \"/admin-question-actions.js\" not in html:\n                body_assets.append('<script defer src=\"/admin-question-actions.js?v=7120\"></script>')\n"
          assert action_marker in frontend
          frontend = frontend.replace(
              action_marker,
              action_marker + "            if \"/review-links-66.js\" not in html:\n                body_assets.append('<script defer src=\"/review-links-66.js?v=7400\"></script>')\n",
              1,
          )
          ast.parse(frontend)
          write('pgy_frontend.py', frontend)

          # ---- Make backend-only completed features real frontend features. ----
          actions = read('static/admin-question-actions.js')
          old_delete = """      for(const id of ids){
                const r=await fetch(`/api/quiz-questions/${encodeURIComponent(id)}`,{method:'DELETE',headers:{'X-Admin-Key':key}});
                const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'批次刪除失敗');
              }
              window.updateQuestionCacheAndPaint(catId,[],{removeIds:ids});"""
          new_delete = """      const r=await fetch('/api/quiz-questions/batch-delete',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({ids})});
              const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'批次刪除失敗');
              window.updateQuestionCacheAndPaint(catId,[],{removeIds:ids});"""
          assert actions.count(old_delete) == 1
          actions = actions.replace(old_delete, new_delete, 1)
          write('static/admin-question-actions.js', actions)

          workspace = read('static/workspace-shell-70.js')
          audit_start = "auditPanel.innerHTML = `\n      <section"
          assert audit_start in workspace
          security_section = """auditPanel.innerHTML = `
              <section class=\"bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3\">
                <div><h4 class=\"font-black text-slate-900\">🛡️ 安全狀態</h4><p class=\"mt-1 text-xs text-slate-500\">只顯示安全策略是否啟用，不回傳或顯示任何密鑰。</p></div>
                <div id=\"security-status-70\" class=\"grid sm:grid-cols-2 lg:grid-cols-3 gap-2\"><div class=\"text-xs text-slate-400\">讀取安全狀態中…</div></div>
              </section>
              <section"""
          workspace = workspace.replace(audit_start, security_section, 1)
          audit_vars = """    const status = document.getElementById('audit-status-70');
              const body = document.getElementById('audit-body-70');
              try {"""
          assert audit_vars in workspace
          security_fetch = """    const status = document.getElementById('audit-status-70');
              const body = document.getElementById('audit-body-70');
              const securityHost = document.getElementById('security-status-70');
              try {
                const securityResponse = await fetch('/api/security/status', {credentials: 'same-origin', cache: 'no-store'});
                const security = await securityResponse.json().catch(() => ({}));
                if (!securityResponse.ok) throw new Error(security.error || `讀取失敗（${securityResponse.status}）`);
                const chip = (label, value, good=true) => `<div class=\"rounded-xl border ${good?'border-emerald-200 bg-emerald-50':'border-amber-200 bg-amber-50'} p-3\"><div class=\"text-[11px] font-bold text-slate-500\">${esc(label)}</div><div class=\"mt-1 text-sm font-black text-slate-900\">${esc(value)}</div></div>`;
                securityHost.innerHTML = [
                  chip('Session 期限', `${Number(security.sessionHours||0)} 小時`, Number(security.sessionHours||0)>0),
                  chip('Secure Cookie', security.secureCookie?'已啟用':'未啟用', !!security.secureCookie),
                  chip('CSRF Origin 檢查', security.csrfOriginCheck?'已啟用':'未啟用', !!security.csrfOriginCheck),
                  chip('登入失敗限制', `${Number(security.loginRateLimitMaxAttempts||0)} 次`, Number(security.loginRateLimitMaxAttempts||0)>0),
                  chip('CSP', security.cspEnforced?'強制模式':'Report-Only', !!security.cspEnforced),
                  chip('Production Secret', security.productionSecretRequired?'正式環境必填':'非強制', !!security.productionSecretRequired),
                ].join('');
              } catch (securityError) {
                if (securityHost) securityHost.innerHTML = `<div class=\"sm:col-span-2 lg:col-span-3 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800\">⚠️ ${esc(securityError.message)}</div>`;
              }
              try {"""
          workspace = workspace.replace(audit_vars, security_fetch, 1)
          write('static/workspace-shell-70.js', workspace)

          # ---- Remove dead public management markup and legacy public handlers. ----
          public_pages = ['static/index.html','static/area-internal.html','static/area-pgy.html']
          removed_header_links = 0
          for path in public_pages:
              html = read(path)
              html, n = re.subn(r'<a\s+class=\"v575-manage-direct\"[^>]*>教學管理</a>', '', html)
              removed_header_links += n
              html = re.sub(r'/portal-v56\.js\?v=\d+', '/portal-v56.js?v=7400', html)
              if path != 'static/index.html':
                  html, _ = re.subn(r'<a\s+href=\"/system\?[^\"]*admin=1[^\"]*workspace=[^\"]+\">⚙<span>管理</span></a>', '', html)
              write(path, html)
          assert removed_header_links == 3, removed_header_links

          nav = read('static/portal-navigation-73.js')
          dead_remove = "    document.querySelectorAll('.v575-manage-direct').forEach(entry=>entry.remove());\n"
          assert nav.count(dead_remove) == 1
          nav = nav.replace(dead_remove, '', 1)
          write('static/portal-navigation-73.js', nav)

          portal = read('static/portal-v56.js')
          dead_handler = re.compile(
              r'\n  // Public \"教學管理\" navigation opens the area catalog\.[\s\S]*?\n  \$\$\(\'\.v575-manage-direct\'\)\.forEach\(link=>link\.addEventListener\(\'click\',event=>\{[\s\S]*?\n  \}\)\);\n',
              re.M,
          )
          portal, n = dead_handler.subn('\n', portal, count=1)
          assert n == 1
          write('static/portal-v56.js', portal)

          v575 = read('static/v575.css')
          v575, n1 = re.subn(r'body\.portal-v56 \.v575-home-nav \.v575-manage-direct\{[^\n]*\}\r?\n?', '', v575)
          v575, n2 = re.subn(r'body\.portal-v56 \.v575-home-nav \.v575-manage-direct:hover\{[^\n]*\}\r?\n?', '', v575)
          assert n1 == 1 and n2 == 1, (n1,n2)
          write('static/v575.css', v575)

          teaching_css = ROOT/'static/teaching.css'
          assert teaching_css.exists()
          teaching_css.unlink()
          assert '.teaching-welcome' in read('static/learner.css')

          # ---- Update regression contracts. ----
          nav_test = read('tests/test_teacher_68_material_navigation.py')
          old_test = """    def test_portal_navigation_uses_area_catalog_without_group_hardcoding(self):
                  portal = self.source(\"static/portal-v56.js\")
                  self.assertIn(\"$$('.v575-manage-direct')\", portal)
                  self.assertIn(\"location.pathname==='/pgy'?'/pgy':'/internal'\", portal)
                  self.assertIn(\"['教材','/internal']\", portal)
"""
          new_test = """    def test_portal_navigation_has_no_dead_public_management_handler(self):
                  portal = self.source(\"static/portal-v56.js\")
                  self.assertNotIn(\"$$('.v575-manage-direct')\", portal)
                  self.assertNotIn(\"location.pathname==='/pgy'?'/pgy':'/internal'\", portal)
                  self.assertIn(\"['教材','/internal']\", portal)
"""
          assert old_test in nav_test
          nav_test = nav_test.replace(old_test, new_test, 1)
          write('tests/test_teacher_68_material_navigation.py', nav_test)

          stage3 = read('tests/test_final_convergence_stage3_cleanup.py')
          needle = "    def test_admin_key_remains_session_rbac_compatibility_only(self):\n"
          assert needle in stage3
          new_case = """    def test_legacy_bundle_is_now_shared_state_and_docx_fallback_only(self):
                  forbidden = (
                      'function renderAdminCourseMaterialHub(',
                      'function quizCategoryCardHTML(',
                      'function renderAdminUserAccounts(',
                      'function renderAdminPeople(',
                      'function renderAdminSystemStatus(',
                      'function renderCategoryChart(',
                      'function resetCurrentQuiz(',
                      'function toggleSopModal(',
                      'function adminPayloadFromQuestionEditor(',
                  )
                  for item in forbidden:
                      self.assertNotIn(item, self.legacy)

"""
          stage3 = stage3.replace(needle, new_case + needle, 1)
          write('tests/test_final_convergence_stage3_cleanup.py', stage3)

          final_test = r'''from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[1]


class FinalSkeletonCleanup74Tests(unittest.TestCase):
    def source(self, path):
        return ROOT.joinpath(path).read_text(encoding="utf-8")

    def test_public_portals_have_no_dead_v575_management_markup(self):
        for path in ("static/index.html", "static/area-internal.html", "static/area-pgy.html"):
