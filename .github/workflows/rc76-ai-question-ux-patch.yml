name: RC76 AI Question UX Patch
on:
  push:
    branches: [hotfix/rc76-ai-authoring-mobile-question-ux]
    paths:
      - '.github/workflows/rc76-ai-question-ux-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/rc76-ai-authoring-mobile-question-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Apply guarded patch
        run: python .github/scripts/rc76_ai_question_ux.py
      - name: Syntax and focused regression
        run: |
          node --check static/teacher-content-studio-71.js
          node --check static/admin-question-editor-ui.js
          node --check static/admin-question-bank.js
          python -m pytest -q tests/test_rc76_ai_question_mobile_ux.py
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/teacher-content-studio-71.js static/admin-question-bank.js tests/test_rc76_ai_question_mobile_ux.py
          git commit -m 'RC 7.6 converge AI authoring and mobile question actions'
          git push
