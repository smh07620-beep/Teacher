name: Stage 3 guarded source cleanup

on:
  push:
    branches:
      - refactor/final-convergence-stage3-source-cleanup

permissions:
  contents: write

jobs:
  delete-retired-wizard-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-convergence-stage3-source-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove exactly the retired Course Wizard runtime block
        shell: python
        run: |
          from pathlib import Path

          path = Path("static/system-admin.js")
          text = path.read_text(encoding="utf-8")
          start = "let courseWizardBusy=false;"
          end = "async function getAdminKey() {"

          if text.count(start) != 1:
              raise SystemExit(f"expected exactly one start marker, found {text.count(start)}")
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          removed = text[start_index:end_index]

          required = (
              "function setCourseWizardProgress(",
              "function uploadWizardMaterial(",
              "const WIZARD_MATERIAL_TYPE_META=",
              "function setCourseWizardBusy(",
              "function resetCourseWizardForm(",
              "async function adminCreateCourseBundle(",
          )
          missing = [marker for marker in required if marker not in removed]
          if missing:
              raise SystemExit(f"guard failed; expected wizard markers missing from deletion block: {missing}")

          path.write_text(text[:start_index] + text[end_index:], encoding="utf-8")
      - name: Guard deletion-only diff
        run: |
          git diff --check
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $2}')" -gt "0"
          git diff -- static/system-admin.js | grep -q -- "-let courseWizardBusy=false;"
          git diff -- static/system-admin.js | grep -q -- "-async function adminCreateCourseBundle("
          ! git diff -- static/system-admin.js | grep -q '^+'
      - name: JavaScript syntax and Stage 3 contract
        run: |
          node --check static/system-admin.js
          python -m unittest tests.test_final_convergence_stage3_cleanup -v
      - name: Commit guarded deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/system-admin.js
          git commit -m "refactor: remove retired Course Wizard runtime [skip ci]"
          git push origin HEAD:refactor/final-convergence-stage3-source-cleanup
