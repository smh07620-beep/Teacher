name: Playwright UI checks

on:
  push:
    branches:
      - main
      - feature/reliability-hardening-20260921
      - hardening/ci-scope-postgres-observability
  pull_request:

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start deterministic UI harness
        run: |
          python tests/ui_harness.py > ui-harness.log 2>&1 &
          echo $! > ui-harness.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ui-harness.log
          exit 1

      - name: Start real canonical Flask app
        run: |
          python tests/real_flask_ui_server.py > real-flask.log 2>&1 &
          echo $! > real-flask.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat real-flask.log
          exit 1

      - name: Run deterministic responsive browser regressions
        env:
          TEACHER_UI_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/playwright/ui-regression.spec.js --reporter=line --workers=1

      - name: Run accessibility browser regressions
        env:
          TEACHER_UI_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/playwright/accessibility-regression.spec.js --reporter=line --workers=1

      - name: Run real Flask browser smoke regressions
        env:
          TEACHER_FLASK_BASE_URL: http://127.0.0.1:4174
        run: npx playwright test tests/playwright/real-flask-smoke.spec.js --reporter=line --workers=1

      - name: Show harness logs on failure
        if: failure()
        run: |
          echo '=== deterministic harness ==='
          cat ui-harness.log || true
          echo '=== real Flask app ==='
          cat real-flask.log || true
