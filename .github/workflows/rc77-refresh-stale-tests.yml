name: RC 7.7 refresh stale expectations

on:
  push:
    branches:
      - hotfix/content-container-convergence-77

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/content-container-convergence-77
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only stale UI expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              assert n==1, f'{path}: expected one stale marker, got {n}: {old!r}'
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          path='tests/test_rc_mobile_workspace_stability_75.py'
          replace_once(path, "        for marker in ('chooseExamForAi', 'mountAiPanel', 'restoreAiPanel', 'data-studio-ai-confirm', 'data-teacher75-ai-host'):", "        for marker in ('renderExamContainer', 'runExamAction', 'mountAiPanel', 'restoreAiPanel', 'data-teacher75-ai-host', 'const deadline=Date.now()+6000'):")
          replace_once(path, "        self.assertIn(\"if(action === 'ai-question') return chooseExamForAi();\", self.studio)", "        self.assertIn(\"if(action==='ai')return mountAiPanel(catId);\", self.studio)\n        self.assertNotIn('chooseExamForAi', self.studio)")
          replace_once(path, "        self.assertIn('AI 設定、產生候選題與人工審核都留在同一個建立流程', self.studio)", "        self.assertIn('已鎖定目前考卷；關聯教材會自動帶入', self.studio)")

          path='tests/test_system_workspace_simplification_75.py'
          replace_once(path, '        self.assertIn("teacher75OpenCourseWizard", studio)', '        self.assertIn("mountCourseWizardInStudio", studio)\n        self.assertIn("data-course-wizard-host-77", studio)\n        self.assertIn("document.getElementById(\'course-wizard-681\')", studio)\n        self.assertNotIn("teacher75OpenCourseWizard", studio)')

          path='tests/test_teacher_content_studio_71.py'
          replace_once(path, "            '建立／管理考卷', '一般考題', '圖片判讀題', '影片互動題', 'AI 輔助出題',", "            '考卷管理', '一般考題', '圖片判讀題', '影片互動題', 'AI 輔助出題',")
          PY
      - name: Run affected regression tests
        run: |
          python -m unittest tests.test_rc_mobile_workspace_stability_75
          python -m unittest tests.test_system_workspace_simplification_75
          python -m unittest tests.test_teacher_content_studio_71
          python -m unittest tests.test_content_container_convergence_77
      - name: Diff hygiene
        run: git diff --check
      - name: Commit expectation refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_rc_mobile_workspace_stability_75.py tests/test_system_workspace_simplification_75.py tests/test_teacher_content_studio_71.py
          git diff --cached --quiet && exit 0
          git commit -m 'Update regression expectations for RC 7.7 container IA'
          git push origin HEAD:hotfix/content-container-convergence-77
