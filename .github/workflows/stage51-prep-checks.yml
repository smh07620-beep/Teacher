name: Stage 5.1 prep checks

on:
  push:
    branches:
      - refactor/stage5.1-domain-ownership-prep

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3' 'Pillow>=10.4,<12.0'
      - name: Compile
        run: |
          python -m py_compile app.py pgy_app.py
          python -m compileall -q teacher_app tests
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Runtime ownership smoke
        run: |
          python - <<'PY'
          import pgy_app
          endpoints = (
              'api_courses', 'api_create_course', 'api_get_teaching_plan',
              'api_list_quiz_categories', 'api_create_quiz_category', 'api_review_quiz_category',
              'api_list_slides', 'api_admin_slides',
          )
          for endpoint in endpoints:
              fn = pgy_app.app.view_functions[endpoint]
              chain = []
              seen = set()
              while fn is not None and id(fn) not in seen:
                  seen.add(id(fn))
                  chain.append(getattr(fn, '__module__', type(fn).__module__))
                  fn = getattr(fn, '__wrapped__', None)
              print(endpoint, ' -> '.join(chain))
          PY
