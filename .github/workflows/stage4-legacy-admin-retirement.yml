name: Stage 4 guarded legacy admin retirement

on:
  push:
    branches:
      - refactor/stage4-5-legacy-retirement

permissions:
  contents: write

jobs:
  retire-shadowed-admin-functions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage4-5-legacy-retirement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST parser
        run: npm install --no-save --package-lock=false acorn@8
      - name: Remove only top-level legacy functions with canonical window owners
        shell: node {0}
        run: |
          const fs = require('fs');
          const acorn = require('acorn');

          const legacyPath = 'static/system-admin.js';
          const canonicalPaths = [
            'static/admin-workspace.js',
            'static/admin-results.js',
            'static/admin-results-data.js',
            'static/admin-results-workspace.js',
            'static/admin-results-export.js',
            'static/admin-course-material.js',
            'static/admin-materials.js',
            'static/admin-people.js',
            'static/admin-announcements.js',
            'static/admin-system.js',
            'static/admin-jobs.js',
            'static/admin-material-upload.js',
            'static/admin-question-bank.js',
            'static/admin-quiz-materials.js',
            'static/admin-question-editor-ui.js',
            'static/admin-question-actions.js',
            'static/admin-question-panel.js',
            'static/admin-ai-questions.js',
            'static/admin-exam-settings.js',
            'static/admin-doc-templates.js',
            'static/admin-pgy-assessments.js',
            'static/admin-external-media.js',
          ];

          const owners = new Map();
          const exportRe = /window\.([A-Za-z_$][\w$]*)\s*=/g;
          for (const path of canonicalPaths) {
            const source = fs.readFileSync(path, 'utf8');
            let match;
            while ((match = exportRe.exec(source)) !== null) {
              if (!owners.has(match[1])) owners.set(match[1], []);
              owners.get(match[1]).push(path.split('/').pop());
            }
          }

          let text = fs.readFileSync(legacyPath, 'utf8');
          const ast = acorn.parse(text, {
            ecmaVersion: 'latest',
            sourceType: 'script',
            allowHashBang: true,
          });

          const removals = [];
          for (const node of ast.body) {
            if (node.type !== 'FunctionDeclaration' || !node.id) continue;
            const name = node.id.name;
            if (!owners.has(name)) continue;
            let end = node.end;
            while (end < text.length && (text[end] === ' ' || text[end] === '\t')) end++;
            if (text.slice(end, end + 2) === '\r\n') end += 2;
            else if (text[end] === '\n' || text[end] === '\r') end += 1;
            if (text.slice(end, end + 2) === '\r\n') end += 2;
            else if (text[end] === '\n' || text[end] === '\r') end += 1;
            removals.push({start: node.start, end, name, owner: owners.get(name)});
          }

          if (!removals.length) throw new Error('guard failed: no shadowed top-level functions found');
          const names = new Set(removals.map(item => item.name));
          const expected = [
            'openEssayReview', 'renderAdminCourses', 'renderAdminAnnouncements',
            'renderStorageStatus', 'renderAdminMaterials', 'renderMaterialJobs'
          ];
          const overlap = expected.filter(name => names.has(name));
          if (overlap.length < 4) {
            throw new Error(`guard failed: too few expected canonical overlaps: ${overlap.join(', ')}`);
          }
          if (names.has('getAdminKey')) throw new Error('guard failed: attempted getAdminKey deletion');

          for (const item of removals.sort((a, b) => b.start - a.start)) {
            text = text.slice(0, item.start) + text.slice(item.end);
            console.log(`retired ${item.name} -> ${item.owner.join(', ')}`);
          }

          for (const marker of ['async function getAdminKey()', 'cachedTemplateBuffer', 'pendingExportRecordIndex']) {
            if (!text.includes(marker)) throw new Error(`guard failed: required fallback marker lost: ${marker}`);
          }
          fs.writeFileSync(legacyPath, text, 'utf8');
          console.log(`Removed ${removals.length} shadowed function implementations.`);
      - name: Guard deletion-only legacy diff
        run: |
          git diff --check
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $2}')" -gt "0"
          ! git diff -- static/system-admin.js | grep -q '^+'
          echo "system-admin.js diff:"
          git diff --stat -- static/system-admin.js
      - name: JavaScript syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Commit guarded Stage 4 deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/system-admin.js
          git commit -m "refactor: retire shadowed legacy admin functions [skip ci]"
          git push origin HEAD:refactor/stage4-5-legacy-retirement
