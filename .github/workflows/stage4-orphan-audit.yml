name: Stage 4 orphan admin audit

on:
  push:
    branches:
      - refactor/stage4-5-legacy-retirement

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST parser
        run: npm install --no-save acorn@8
      - name: Find zero-caller top-level legacy declarations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const acorn = require(process.cwd() + '/node_modules/acorn');

          const targetPath = 'static/system-admin.js';
          const source = fs.readFileSync(targetPath, 'utf8');
          const ast = acorn.parse(source, {ecmaVersion: 'latest', sourceType: 'script', ranges: true});

          function walk(node, visit, parent=null) {
            if (!node || typeof node !== 'object') return;
            visit(node, parent);
            for (const [key, value] of Object.entries(node)) {
              if (key === 'parent') continue;
              if (Array.isArray(value)) for (const child of value) walk(child, visit, node);
              else if (value && typeof value === 'object' && typeof value.type === 'string') walk(value, visit, node);
            }
          }

          const identifierCounts = new Map();
          walk(ast, (node) => {
            if (node.type === 'Identifier') identifierCounts.set(node.name, (identifierCounts.get(node.name)||0)+1);
          });

          const declarations = [];
          for (const node of ast.body) {
            if (node.type === 'FunctionDeclaration' && node.id) {
              declarations.push({name: node.id.name, kind: 'function', start: node.start, end: node.end});
            }
            if (node.type === 'VariableDeclaration') {
              for (const d of node.declarations) {
                if (d.id?.type !== 'Identifier') continue;
                const pure = !d.init || ['Literal','ArrayExpression','ObjectExpression'].includes(d.init.type)
                  || (d.init.type === 'UnaryExpression' && d.init.argument?.type === 'Literal');
                if (pure) declarations.push({name: d.id.name, kind: 'state', start: node.start, end: node.end});
              }
            }
          }

          function allFiles(dir) {
            const out=[];
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              const p=path.join(dir,ent.name);
              if (ent.isDirectory()) out.push(...allFiles(p));
              else if (/\.(js|html)$/i.test(ent.name) && p !== targetPath) out.push(p);
            }
            return out;
          }
          const otherFiles = allFiles('static');
          const protectedNames = new Set([
            'getAdminKey','cachedTemplateBuffer','pendingExportRecordIndex','isExportingCurrentTab'
          ]);

          const candidates=[];
          for (const d of declarations) {
            if (protectedNames.has(d.name)) continue;
            if ((identifierCounts.get(d.name)||0) !== 1) continue;
            const re = new RegExp('\\b' + d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b');
            let external=[];
            for (const file of otherFiles) {
              if (re.test(fs.readFileSync(file,'utf8'))) external.push(file);
            }
            if (!external.length) candidates.push(d);
          }

          console.log(`Top-level declarations audited: ${declarations.length}`);
          console.log(`Zero-caller candidates: ${candidates.length}`);
          for (const c of candidates) console.log(`${c.kind}\t${c.name}\t${c.start}:${c.end}`);
          fs.writeFileSync('/tmp/stage4-orphans.json', JSON.stringify(candidates,null,2));
          NODE
      - name: JavaScript baseline syntax
        run: node --check static/system-admin.js
