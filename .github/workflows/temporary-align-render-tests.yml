name: Temporary align Render tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-align-render-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align web-only Render tests
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/test_deployment_config.py": (
                  '''        self.assertEqual(render.count("- type: worker"), 1)\n        self.assertIn("name: biochemical-training-ai-worker", render)\n        self.assertIn("dockerCommand: python -u ai_question_worker.py", render)\n        self.assertIn("plan: 0.5c-512mb", render)\n''',
                  '''        self.assertEqual(render.count("- type: worker"), 0)\n        self.assertNotIn("name: biochemical-training-ai-worker", render)\n        self.assertNotIn("dockerCommand: python -u ai_question_worker.py", render)\n        self.assertIn("plan: free", render)\n        reminder = (ROOT / ".github" / "workflows" / "email-reminders.yml").read_text(encoding="utf-8")\n        self.assertIn("scripts/send_email_reminders.py", reminder)\n'''
              ),
              "tests/test_local_worker_auto_update_681.py": (
                  '''        self.assertIn("biochemical-training-ai-worker", render)\n        self.assertIn("python -u ai_question_worker.py", render)\n''',
                  '''        self.assertNotIn("biochemical-training-ai-worker", render)\n        self.assertNotIn("python -u ai_question_worker.py", render)\n        self.assertNotIn("type: worker", render)\n        reminder = ROOT.joinpath(".github", "workflows", "email-reminders.yml").read_text(encoding="utf-8")\n        self.assertIn("scripts/send_email_reminders.py", reminder)\n'''
              ),
              "tests/test_render_worker_scheme_b.py": (
                  '''        self.assertEqual(source.count("type: worker"), 1)\n        self.assertIn("biochemical-training-ai-worker", source)\n        self.assertIn("python -u ai_question_worker.py", source)\n''',
                  '''        self.assertEqual(source.count("type: worker"), 0)\n        self.assertNotIn("biochemical-training-ai-worker", source)\n        self.assertNotIn("python -u ai_question_worker.py", source)\n        reminder = ROOT.joinpath(".github", "workflows", "email-reminders.yml").read_text(encoding="utf-8")\n        self.assertIn("scripts/send_email_reminders.py", reminder)\n'''
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"expected block missing: {filename}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_deployment_config.py tests/test_local_worker_auto_update_681.py tests/test_render_worker_scheme_b.py
          git commit -m "Align tests with free web-only Render deployment"
          git push origin HEAD:main
