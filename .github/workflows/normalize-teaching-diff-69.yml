name: Normalize teaching diff 6.9

on:
  push:
    branches:
      - fix/session-rbac-cleanup-69

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-rbac-cleanup-69
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/normalize_teaching_diff_69.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep teaching RBAC cleanup diff focused"
          git push origin HEAD:fix/session-rbac-cleanup-69
