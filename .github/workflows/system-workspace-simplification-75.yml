name: RC system workspace simplification 7.5

on:
  push:
    branches:
      - hotfix/rc-system-workspace-simplification-75

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/rc-system-workspace-simplification-75
          fetch-depth: 0
      - name: Apply guarded simplification patch
        run: python .github/scripts/system_workspace_simplification_75.py
      - name: JS syntax
        run: |
          node --check static/teacher-content-studio-71.js
          node --check static/teacher-ux-convergence-72.js
          node --check static/workspace-shell-70.js
      - name: Focused regression gates
        run: |
          python -m unittest tests.test_system_workspace_simplification_75 tests.test_final_skeleton_cleanup_74
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/system.html static/teacher-content-studio-71.js static/teacher-ux-convergence-72.js static/workspace-shell-70.js tests/test_system_workspace_simplification_75.py ARCHITECTURE_FINAL_CONVERGENCE.md
          git commit -m "RC 7.5 simplify teaching and maintenance workspace"
          git push origin HEAD:hotfix/rc-system-workspace-simplification-75
