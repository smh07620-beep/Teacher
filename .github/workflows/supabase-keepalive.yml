name: Supabase keep-alive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-keepalive.yml
  schedule:
    # GitHub Actions cron uses UTC. 01:37 UTC = 09:37 Asia/Taipei (UTC+8).
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Wake Render and verify Supabase
    runs-on: ubuntu-latest
    # curl can make the initial attempt plus four retries. Keep each transfer
    # bounded to 60 seconds and leave headroom for retry delays and validation.
    timeout-minutes: 12
    env:
      # Single production URL source shared with smoke/fallback workflows.
      TEACHER_PRODUCTION_URL: ${{ vars.TEACHER_PRODUCTION_URL || 'https://teacher-j3id.onrender.com' }}
    steps:
      - name: Call production health endpoint
        shell: bash
        run: |
          set -euo pipefail

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          python3 - "$TEACHER_PRODUCTION_URL" <<'PY'
          import socket
          import sys
          from urllib.parse import urlsplit

          url = sys.argv[1].strip()
          parsed = urlsplit(url)
          host = parsed.hostname
          if not host:
              raise SystemExit(f"Invalid TEACHER_PRODUCTION_URL: {url!r}")
          port = parsed.port or (443 if parsed.scheme == "https" else 80)
          try:
              rows = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              raise SystemExit(f"DNS resolution failed for {host}: {exc}") from exc
          addresses = sorted({row[4][0] for row in rows})
          print(f"DNS OK: {host} -> {', '.join(addresses)}")
          PY

          # /health is intentionally used instead of /live: the canonical
          # health handler opens the configured database and reads
          # schema_migrations, so this creates real PostgreSQL/Supabase
          # activity while also waking a sleeping Render web service.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 60 \
            --output "$response" \
            "${TEACHER_PRODUCTION_URL%/}/health"

          python - "$response" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          database = payload.get("database") or {}
          migrations = payload.get("migrations") or {}
          deployment = payload.get("deployment") or {}

          if payload.get("ok") is not True:
              raise SystemExit("Teacher /health did not report ok=true")
          if database.get("ok") is not True:
              raise SystemExit("Teacher /health did not reach the database")
          if database.get("kind") != "postgres":
              raise SystemExit(
                  f"Expected production PostgreSQL/Supabase, got {database.get('kind')!r}"
              )
          if migrations.get("ok") is not True:
              raise SystemExit(
                  f"Required migrations are not healthy: {migrations.get('missing')!r}"
              )
          if deployment.get("provider") != "render":
              raise SystemExit(
                  f"Expected Render production deployment, got {deployment.get('provider')!r}"
              )

          print(
              "Supabase keep-alive OK: "
              f"database={database.get('kind')}, "
              f"migrations={len(migrations.get('applied') or [])}, "
              f"commit={deployment.get('commit') or 'unknown'}"
          )
          PY
