name: Session RBAC cleanup 6.9

on:
  push:
    branches:
      - fix/session-rbac-cleanup-69

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-rbac-cleanup-69
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/session_rbac_cleanup_69.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire AdminKey compatibility from normal teacher workflows"
          git push origin HEAD:fix/session-rbac-cleanup-69
