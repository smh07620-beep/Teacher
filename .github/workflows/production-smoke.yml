name: Production smoke acceptance

# Render uses autoDeployTrigger: checksPass. This workflow must NOT run from
# push/workflow_run for the same commit, otherwise Render waits for this smoke
# check while the smoke check waits for Render to deploy: a circular gate.
# Scheduled/manual runs are deployment-after checks and do not participate in
# the deployment-precondition check suite.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-acceptance
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Single production URL source. Override with the repository variable without editing workflows.
      TEACHER_PRODUCTION_URL: ${{ vars.TEACHER_PRODUCTION_URL || 'https://teacher-j3id.onrender.com' }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact Render deployment and public read-only flows
        run: |
          python tools/production_smoke.py \
            --base-url "$TEACHER_PRODUCTION_URL" \
            --expected-commit "$EXPECTED_COMMIT" \
            --max-wait-seconds 720 \
            --poll-seconds 15

      - name: Upload production smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-report.json
          if-no-files-found: warn
          retention-days: 14
