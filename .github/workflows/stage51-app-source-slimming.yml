name: Stage 5.1 guarded app source slimming

on:
  push:
    branches:
      - refactor/stage4-5-legacy-retirement

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage4-5-legacy-retirement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3' 'Pillow>=10.4,<12.0'
      - name: Replace exact legacy route bodies with canonical delegates
        run: |
          python <<'PY'
          import ast
          from pathlib import Path

          path = Path('app.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          tree = ast.parse(source)

          stubs = {
          'api_list_slides': '''def api_list_slides():
              from teacher_app.materials import service as canonical_materials
              return jsonify(canonical_materials.list_materials(sys.modules[__name__], request.args.get("area", DEFAULT_TRAINING_AREA)))
          ''',
          'api_admin_slides': '''def api_admin_slides():
              from teacher_app.materials import service as canonical_materials
              denied = require_admin()
              if denied: return denied
              return jsonify(canonical_materials.list_admin_materials(sys.modules[__name__]))
          ''',
          'api_update_slide': '''def api_update_slide(slide_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.materials import service as canonical_materials
              from teacher_app.materials.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_materials.update_material(sys.modules[__name__], slide_id, request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_delete_slide': '''def api_delete_slide(slide_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.materials import service as canonical_materials
              from teacher_app.materials.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_materials.delete_material(sys.modules[__name__], slide_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_courses': '''def api_courses():
              from teacher_app.courses import service as canonical_courses
              area = request.args.get("area", DEFAULT_TRAINING_AREA)
              group = request.args.get("group", "") or None
              return jsonify(canonical_courses.list_courses(sys.modules[__name__], area, group, False))
          ''',
          'api_courses_admin': '''def api_courses_admin():
              from teacher_app.courses import service as canonical_courses
              denied = require_admin()
              if denied: return denied
              return jsonify(canonical_courses.list_courses(sys.modules[__name__], request.args.get("area", "") or None, request.args.get("group", "") or None, True))
          ''',
          'api_create_course': '''def api_create_course():
              from teacher_app.common.errors import ApiError
              from teacher_app.courses import service as canonical_courses
              from teacher_app.courses.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_courses.create_course(sys.modules[__name__], request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_update_course': '''def api_update_course(course_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.courses import service as canonical_courses
              from teacher_app.courses.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_courses.update_course(sys.modules[__name__], course_id, request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_delete_course': '''def api_delete_course(course_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.courses import service as canonical_courses
              from teacher_app.courses.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_courses.delete_course(sys.modules[__name__], course_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_get_teaching_plan': '''def api_get_teaching_plan(course_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.courses import service as canonical_courses
              from teacher_app.courses.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_courses.get_teaching_plan(sys.modules[__name__], course_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_save_teaching_plan': '''def api_save_teaching_plan(course_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.courses import service as canonical_courses
              from teacher_app.courses.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_courses.save_teaching_plan(sys.modules[__name__], course_id, request.get_json(silent=True)))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_list_quiz_categories': '''def api_list_quiz_categories():
              from teacher_app.assessments import service as canonical_assessments
              return jsonify(canonical_assessments.list_categories(sys.modules[__name__], request.args.get("group", "") or None, request.args.get("area", DEFAULT_TRAINING_AREA), False))
          ''',
          'api_admin_list_quiz_categories': '''def api_admin_list_quiz_categories():
              from teacher_app.assessments import service as canonical_assessments
              denied = require_admin()
              if denied: return denied
              return jsonify(canonical_assessments.list_categories(sys.modules[__name__], request.args.get("group", "") or None, request.args.get("area", DEFAULT_TRAINING_AREA), True))
          ''',
          'api_create_quiz_category': '''def api_create_quiz_category():
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.create_category(sys.modules[__name__], request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_update_quiz_category': '''def api_update_quiz_category(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.update_category(sys.modules[__name__], category_id, request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_review_quiz_category': '''def api_review_quiz_category(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.review_category(sys.modules[__name__], category_id, request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_quiz_publications': '''def api_quiz_publications(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.list_publications(sys.modules[__name__], category_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_publish_quiz_category': '''def api_publish_quiz_category(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.publish_category(sys.modules[__name__], category_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_quiz_category_materials': '''def api_quiz_category_materials(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.category_materials(sys.modules[__name__], category_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_update_quiz_category_materials': '''def api_update_quiz_category_materials(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.update_category_materials(sys.modules[__name__], category_id, request.get_json(silent=True) or {}))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          'api_delete_quiz_category': '''def api_delete_quiz_category(category_id):
              from teacher_app.common.errors import ApiError
              from teacher_app.assessments import service as canonical_assessments
              from teacher_app.assessments.routes import _legacy_error as canonical_error
              denied = require_admin()
              if denied: return denied
              try:
                  return jsonify(canonical_assessments.delete_category(sys.modules[__name__], category_id))
              except ApiError as exc:
                  return canonical_error(exc)
          ''',
          }

          targets = set(stubs)
          nodes = {node.name: node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in targets}
          missing = sorted(targets - set(nodes))
          if missing:
              raise SystemExit('missing target functions: ' + ', '.join(missing))

          replacements = []
          for name, node in nodes.items():
              segment = ast.get_source_segment(source, node) or ''
              if 'canonical_' in segment and 'teacher_app.' in segment:
                  continue
              replacements.append((node.lineno - 1, node.end_lineno, stubs[name]))

          if not replacements:
              print('All Stage 5.1 route bodies are already thin canonical delegates.')
          else:
              for start, end, text in sorted(replacements, reverse=True):
                  replacement = [line + '\n' for line in text.strip().splitlines()]
                  lines[start:end] = replacement
              path.write_text(''.join(lines), encoding='utf-8')
              print(f'Replaced {len(replacements)} legacy route bodies with canonical delegates.')
          PY
      - name: Guard source shrink and canonical ownership
        run: |
          git diff --check
          if ! git diff --quiet -- app.py; then
            added=$(git diff --numstat -- app.py | awk '{print $1}')
            deleted=$(git diff --numstat -- app.py | awk '{print $2}')
            echo "app.py additions=$added deletions=$deleted"
            test "$deleted" -gt "$added"
          fi
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('app.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          targets={
            'api_list_slides','api_admin_slides','api_update_slide','api_delete_slide',
            'api_courses','api_courses_admin','api_create_course','api_update_course','api_delete_course','api_get_teaching_plan','api_save_teaching_plan',
            'api_list_quiz_categories','api_admin_list_quiz_categories','api_create_quiz_category','api_update_quiz_category','api_review_quiz_category','api_quiz_publications','api_publish_quiz_category','api_quiz_category_materials','api_update_quiz_category_materials','api_delete_quiz_category'
          }
          found=0
          for node in tree.body:
            if isinstance(node,ast.FunctionDef) and node.name in targets:
              text=ast.get_source_segment(source,node) or ''
              assert 'teacher_app.' in text and 'canonical_' in text, node.name
              for forbidden in ('INSERT INTO courses','UPDATE quiz_categories SET','DELETE FROM materials WHERE','gdrive_delete_material(entry)'):
                assert forbidden not in text, (node.name,forbidden)
              found+=1
          assert found==len(targets),(found,len(targets))
          PY
      - name: Compile and full regression suite
        run: |
          python -m py_compile app.py pgy_app.py
          python -m compileall -q teacher_app tests
          python -m unittest discover -s tests -v
      - name: Commit guarded source slimming
        run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'refactor: reduce legacy domain route bodies to canonical delegates'
          git push origin HEAD:refactor/stage4-5-legacy-retirement
