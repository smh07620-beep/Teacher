name: Windows Worker checks

on:
  push:
    branches:
      - main
      - feature/reliability-hardening-20260921
  pull_request:

permissions:
  contents: read

jobs:
  worker-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse canonical Worker PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'install_material_worker_task.ps1',
            'run_material_worker.ps1',
            'run_material_worker_autostart.ps1',
            'update_material_worker.ps1',
            'install_ai_worker_task.ps1',
            'run_ai_worker_autostart.ps1',
            'install_teacher_workers.ps1',
            'setup_teacher_worker.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$file PowerShell parse failed: $($errors[0].Message)"
            }
          }

      - name: Worker Task Scheduler contract regressions
        shell: pwsh
        run: ./tests/test_material_worker_task_installer.ps1

      - name: Worker Event Log and updater gate regressions
        shell: pwsh
        run: ./tests/test_material_worker_event_log.ps1

      - name: Same-host AI Worker Task Scheduler regressions
        shell: pwsh
        run: ./tests/test_ai_worker_task_installer.ps1

      - name: Stable Worker identity source contract
        shell: pwsh
        run: |
          $installer = Get-Content ./install_material_worker_task.ps1 -Raw
          $supervisor = Get-Content ./run_material_worker_autostart.ps1 -Raw
          $gitignore = Get-Content ./.gitignore -Raw
          foreach ($source in @($installer, $supervisor)) {
            if (-not $source.Contains('Ensure-StableWorkerId')) { throw 'Stable Worker identity helper is missing.' }
            if (-not $source.Contains('.worker-id')) { throw 'Persistent .worker-id state is missing.' }
          }
          if (-not $supervisor.Contains('SetEnvironmentVariable') -or -not $supervisor.Contains('MATERIAL_WORKER_ID')) {
            throw 'Supervisor must export the stable Worker identity to material_worker.py.'
          }
          if (-not $gitignore.Contains('.worker-id')) { throw '.worker-id must remain gitignored.' }
          $worker = Get-Content ./material_worker.py -Raw
          if (-not $worker.Contains('.worker-runtime.lock') -or -not $worker.Contains('DUPLICATE_RUNTIME=76')) {
            throw 'Python Worker runtime single-instance guard is missing.'
          }
          if ($worker.Contains('socket.gethostname()}:{os.getpid()}')) {
            throw 'Worker fallback identity must not depend on process ID.'
          }
          if (-not $supervisor.Contains('$workerExit -eq 76')) {
            throw 'Supervisor must treat duplicate runtime ownership as a non-crash wait state.'
          }
          if (-not $gitignore.Contains('.worker-runtime.lock')) {
            throw '.worker-runtime.lock must remain gitignored.'
          }

      - name: Do not create persistent scheduled tasks in CI
        shell: pwsh
        run: |
          foreach ($taskName in @('Teacher Material Worker', 'Teacher AI Worker')) {
            if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
              throw "CI must not register the production scheduled task: $taskName"
            }
          }
