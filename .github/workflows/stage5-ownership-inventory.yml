name: Stage 5.1 ownership inventory

on:
  push:
    branches:
      - refactor/stage4-5-legacy-retirement

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print target route source and dependencies
        run: |
          python <<'PY'
          import ast
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          targets = {
              'api_list_slides','api_admin_slides','api_update_slide','api_delete_slide',
              'api_courses','api_courses_admin','api_create_course','api_update_course',
              'api_delete_course','api_get_teaching_plan','api_save_teaching_plan',
              'api_list_quiz_categories','api_admin_list_quiz_categories',
              'api_create_quiz_category','api_update_quiz_category','api_review_quiz_category',
              'api_quiz_publications','api_publish_quiz_category','api_quiz_category_materials',
              'api_delete_quiz_category'
          }
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in targets:
                  names = sorted({n.id for n in ast.walk(node) if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)})
                  print(f'===== {node.name} lines {node.lineno}-{node.end_lineno} =====')
                  print('LOAD_NAMES:', ', '.join(names))
                  print(ast.get_source_segment(source, node))
          PY
