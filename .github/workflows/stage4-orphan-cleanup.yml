name: Stage 4 guarded orphan cleanup

on:
  push:
    branches:
      - refactor/stage4-5-legacy-retirement

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage4-5-legacy-retirement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsers and test dependencies
        run: |
          npm install --no-save acorn@8
          python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3' 'Pillow>=10.4,<12.0'
      - name: Delete exact audited zero-caller declarations
        run: |
          node <<'NODE'
          const fs=require('fs');
          const acorn=require(process.cwd()+'/node_modules/acorn');
          const file='static/system-admin.js';
          const src=fs.readFileSync(file,'utf8');
          const ast=acorn.parse(src,{ecmaVersion:'latest',sourceType:'script',ranges:true});
          const targets=new Set([
            'jumpToAdminQuiz','adminSectionLoaded','aiQuestionDrafts','_filteredAiMaterials',
            'adminSaveExpandedQuestionEdits','adminBulkSetQuestionTag','quizMaterialLinkState',
            'adminEditingExamMeta','adminEditQuizQuestion','cachedDocTemplatesMeta','adminWorkspace',
            'adminQuizWorkspaceMode','adminResultWorkspaceMode','teacherWorkspaceMode',
            'ADMIN_PROFILE_COMMON_TAGS','ADMIN_USER_ROLE_LABELS','resetAdminUserPassword',
            'toggleAdminUserAccount','exportCurrentTabToWord'
          ]);
          const found=new Set();
          const ranges=[];
          for(const node of ast.body){
            if(node.type==='FunctionDeclaration' && node.id && targets.has(node.id.name)){
              found.add(node.id.name); ranges.push([node.start,node.end,node.id.name]);
            } else if(node.type==='VariableDeclaration'){
              const names=node.declarations.filter(d=>d.id?.type==='Identifier').map(d=>d.id.name);
              const hit=names.filter(n=>targets.has(n));
              if(hit.length){
                if(hit.length!==names.length) throw new Error(`refuse mixed declaration: ${names.join(',')}`);
                for(const n of hit) found.add(n);
                ranges.push([node.start,node.end,hit.join(',')]);
              }
            }
          }
          const missing=[...targets].filter(n=>!found.has(n));
          if(missing.length) throw new Error('missing audited declarations: '+missing.join(','));
          if(found.size!==targets.size) throw new Error(`expected ${targets.size} names, found ${found.size}`);
          ranges.sort((a,b)=>b[0]-a[0]);
          let out=src;
          for(const [start,end] of ranges){
            let e=end;
            while(e<out.length && (out[e]===' '||out[e]==='\t')) e++;
            if(out[e]==='\r') e++;
            if(out[e]==='\n') e++;
            out=out.slice(0,start)+out.slice(e);
          }
          fs.writeFileSync(file,out);
          console.log(`Removed ${found.size} audited declarations across ${ranges.length} top-level nodes`);
          NODE
      - name: Guard deletion-only diff
        run: |
          git diff --check
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- static/system-admin.js | awk '{print $2}')" -gt "0"
      - name: JavaScript syntax
        run: |
          for f in static/*.js; do node --check "$f"; done
      - name: Full regression suite
        run: |
          python -m compileall -q teacher_app tests
          python -m py_compile app.py pgy_app.py pgy_workflow.py
          python -m unittest discover -s tests -v
      - name: Commit guarded deletion
        run: |
          if git diff --quiet -- static/system-admin.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/system-admin.js
          git commit -m 'refactor: remove zero-caller legacy admin helpers'
          git push origin HEAD:refactor/stage4-5-legacy-retirement
