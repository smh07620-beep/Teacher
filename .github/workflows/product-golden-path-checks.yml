name: Product Golden Path checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  material-operational:
    name: GP-01 + GP-05 material operational path
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Teacher upload → Worker retry → publish → learner-visible material
        run: python -m unittest discover -s tests -p 'test_golden_path_material_operational_20261001.py' -v
