name: Product Golden Path checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  material-operational:
    name: GP-01 + GP-05 material operational path
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Teacher upload → Worker retry → publish → learner-visible material
        run: python -m unittest discover -s tests -p 'test_golden_path_material_operational_20261001.py' -v


  material-full-stack-browser:
    name: GP-01 + GP-06 full-stack Browser → R2 → real Worker → Database → Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'moto[server]>=5.1,<6.0'
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate isolated full-stack credentials
        shell: bash
        run: |
          BROWSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          WORKER_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          R2_ACCESS="$(python -c 'import secrets; print("ci"+secrets.token_hex(8))')"
          R2_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          for VALUE in "$BROWSER_PASSWORD" "$WORKER_TOKEN" "$R2_ACCESS" "$R2_SECRET"; do echo "::add-mask::$VALUE"; done
          {
            echo "TEACHER_CI_BROWSER_PASSWORD=$BROWSER_PASSWORD"
            echo "MATERIAL_WORKER_TOKEN=$WORKER_TOKEN"
            echo "R2_ACCESS_KEY_ID=$R2_ACCESS"
            echo "R2_SECRET_ACCESS_KEY=$R2_SECRET"
            echo "R2_ACCOUNT_ID=ci"
            echo "R2_BUCKET_NAME=teacher-material-fullstack"
            echo "R2_ENDPOINT_URL=http://127.0.0.1:9000"
            echo "R2_REGION=us-east-1"
            echo "MATERIAL_STORAGE_BACKEND=r2"
            echo "MATERIAL_SHARED_STAGING_BACKEND=r2"
            echo "MATERIAL_WORKER_ALLOW_INSECURE_LOCALHOST=true"
            echo "MATERIAL_WORKER_POLL_SECONDS=2"
            echo "MATERIAL_WORKER_HEARTBEAT_SECONDS=5"
            echo "TEACHER_BASE_URL=http://127.0.0.1:4175"
          } >> "$GITHUB_ENV"
      - name: Start isolated R2-compatible object store
        shell: bash
        run: |
          moto_server -H 127.0.0.1 -p 9000 > material-fullstack-s3.log 2>&1 &
          echo $! > material-fullstack-s3.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/ >/dev/null
          python - <<'PY'
          import boto3, os
          from botocore.config import Config
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name=os.environ["R2_REGION"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          bucket = os.environ["R2_BUCKET_NAME"]
          client.create_bucket(Bucket=bucket)
          client.put_bucket_cors(
              Bucket=bucket,
              CORSConfiguration={"CORSRules": [{
                  "AllowedOrigins": ["http://127.0.0.1:4175"],
                  "AllowedMethods": ["GET", "PUT", "POST", "HEAD"],
                  "AllowedHeaders": ["*"],
                  "ExposeHeaders": ["ETag"],
                  "MaxAgeSeconds": 300,
              }]},
          )
          PY
      - name: Start real Flask and canonical material Worker
        shell: bash
        run: |
          python tests/material_fullstack_server.py > material-fullstack-web.log 2>&1 &
          echo $! > material-fullstack-web.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4175/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4175/ready
          python -m teacher_app.worker.material_worker_entry > material-fullstack-worker.log 2>&1 &
          echo $! > material-fullstack-worker.pid
      - name: Browser upload → R2 → real Worker → learner-visible material
        env:
          TEACHER_MATERIAL_FULLSTACK_BASE_URL: http://127.0.0.1:4175
        run: npx playwright test tests/playwright/material-fullstack-golden-path.spec.js --reporter=line --workers=1
      - name: Stop Worker and queue a second Browser upload while offline
        shell: bash
        env:
          TEACHER_MATERIAL_FULLSTACK_BASE_URL: http://127.0.0.1:4175
        run: |
          kill "$(cat material-fullstack-worker.pid)"
          rm -f material-fullstack-worker.pid
          for i in $(seq 1 20); do
            if ! pgrep -f "teacher_app.worker.material_worker_entry" >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/playwright/material-worker-offline-enqueue.spec.js --reporter=line --workers=1
      - name: Prove queued job retained the same R2 staging object
        shell: bash
        run: |
          python - <<'PY'
          import boto3, json, os
          from botocore.config import Config
          saved = json.load(open("material-fullstack-offline-job.json", encoding="utf-8"))
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name=os.environ["R2_REGION"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          result = client.head_object(Bucket=os.environ["R2_BUCKET_NAME"], Key=saved["stagingKey"])
          assert int(result.get("ContentLength") or 0) > 0
          print("retained staging:", saved["jobId"], saved["stagingKey"], result["ContentLength"])
          PY
      - name: Restart canonical Worker and recover the same queued job
        shell: bash
        env:
          TEACHER_MATERIAL_FULLSTACK_BASE_URL: http://127.0.0.1:4175
        run: |
          python -m teacher_app.worker.material_worker_entry >> material-fullstack-worker.log 2>&1 &
          echo $! > material-fullstack-worker.pid
          npx playwright test tests/playwright/material-worker-offline-recovery.spec.js --reporter=line --workers=1
      - name: Prove recovery published final R2 object and removed staging
        shell: bash
        run: |
          python - <<'PY'
          import boto3, json, os
          from botocore.config import Config
          from botocore.exceptions import ClientError
          saved = json.load(open("material-fullstack-offline-job.json", encoding="utf-8"))
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name=os.environ["R2_REGION"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          bucket = os.environ["R2_BUCKET_NAME"]
          final_key = f"materials/{saved['materialId']}/source.txt"
          final = client.head_object(Bucket=bucket, Key=final_key)
          assert int(final.get("ContentLength") or 0) > 0
          try:
              client.head_object(Bucket=bucket, Key=saved["stagingKey"])
          except ClientError as exc:
              code = str(exc.response.get("Error", {}).get("Code", ""))
              assert code in {"404", "NoSuchKey", "NotFound"}, code
          else:
              raise AssertionError("staging object still exists after successful Worker completion")
          print("recovered final:", saved["jobId"], final_key, final["ContentLength"])
          PY
      - name: Show full-stack logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Web ==="
          cat material-fullstack-web.log || true
          echo "=== Worker ==="
          cat material-fullstack-worker.log || true
          echo "=== S3-compatible R2 fixture ==="
          cat material-fullstack-s3.log || true
          echo "=== R2 objects ==="
          python - <<'PY'
          import boto3, os
          from botocore.config import Config
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name=os.environ["R2_REGION"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          try:
              print(client.list_objects_v2(Bucket=os.environ["R2_BUCKET_NAME"]).get("Contents", []))
          except Exception as exc:
              print("R2 diagnostic unavailable:", type(exc).__name__, str(exc)[:240])
          PY
      - name: Stop full-stack services
        if: always()
        shell: bash
        run: |
          test ! -f material-fullstack-worker.pid || kill "$(cat material-fullstack-worker.pid)" || true
          test ! -f material-fullstack-web.pid || kill "$(cat material-fullstack-web.pid)" || true
          test ! -f material-fullstack-s3.pid || kill "$(cat material-fullstack-s3.pid)" || true


  ai-media-production:
    name: GP-09 AI teaching media production and publication path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Source material → PowerPoint revision → provenance → video handoff → canonical material derivative history
        run: python -m unittest discover -s tests -p 'test_f5_*.py' -v

  ai-question-full-stack-browser:
    name: GP-11 AI question + PowerPoint + script + audio + video full-stack Browser paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          python -m pip install -r requirements.txt 'moto[server]>=5.1,<6.0' python-pptx python-docx
          sudo apt-get update && sudo apt-get install -y libreoffice ffmpeg fonts-noto-cjk
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Audio / video canonical regression
        run: python -m unittest tests.test_deterministic_tts_capability tests.test_teacher_media_audio_1014 tests.test_media_audio_preview_queue_isolation tests.test_media_audio_preview_resilience_20261005 tests.test_ai_video_0101 tests.test_ai_video_phase5_0105 tests.test_ai_video_phase6_renderer tests.test_ai_video_performance_optimization -v
      - name: Canonical AI jobs → inspected PPTX/WAV/MP4 → teacher publication → learner saved answers
        shell: bash
        run: python tests/run_ai_fullstack.py tests/playwright/ai-question-fullstack-golden-path.spec.js tests/playwright/ai-powerpoint-fullstack.spec.js tests/playwright/ai-script-fullstack.spec.js tests/playwright/ai-audio-fullstack.spec.js tests/playwright/ai-video-fullstack.spec.js
      - name: Show AI full-stack diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat ai-media-web.log || true
          cat ai-media-worker.log || true
          cat ai-media-material-worker.log || true
          cat ai-media-s3.log || true


  production-readiness:
    name: GP-10 production readiness, content governance, and recovery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Production acceptance → daily focus → change impact → recovery rehearsal
        run: python -m unittest discover -s tests -p 'test_f6_*.py' -v


  assignment-operational:
    name: GP-02 scoped course assignment path
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Group leader all → course group only → intended learner visibility
        run: python -m unittest discover -s tests -p 'test_golden_path_assignment_operational_20261001.py' -v

  course-completion-operational:
    name: GP-03 learner course completion path
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Learner completes material → course completes → teacher sees same progress
        run: python -m unittest discover -s tests -p 'test_golden_path_course_completion_20261001.py' -v

  assessment-operational:
    name: GP-04 assessment lifecycle path
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Learner submit → scoped teacher workspace → review → server-attributed learner result
        run: |
          python -m unittest discover -s tests -p 'test_golden_path_assessment_operational_20261001.py' -v
          python -m unittest discover -s tests -p 'test_exam_record_reader_scope_20261001.py' -v

  worker-offline-recovery:
    name: GP-06 Worker offline recovery path
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline queue → same job/source → Worker returns and claims
        run: python -m unittest discover -s tests -p 'test_golden_path_worker_offline_recovery_20261001.py' -v

  persona-and-provisioning-browser:
    name: GP-07 + GP-08 real browser persona and RBAC provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate isolated browser fixture password
        shell: bash
        run: |
          PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PASSWORD"
          echo "TEACHER_CI_BROWSER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Start real canonical Flask app
        run: |
          python tests/real_flask_ui_server.py > real-flask-golden-path.log 2>&1 &
          echo $! > real-flask-golden-path.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat real-flask-golden-path.log
          exit 1
      - name: Dual-role persona isolation → system-admin provisioning → new scoped teacher login
        env:
          TEACHER_FLASK_BASE_URL: http://127.0.0.1:4174
        run: npx playwright test tests/playwright/product-golden-path-p1-real-flask.spec.js --reporter=line --workers=1
      - name: Show real Flask logs on failure
        if: failure()
        run: cat real-flask-golden-path.log || true
