name: AI authoring UX 7.6 guarded patcher

on:
  push:
    branches:
      - hotfix/ai-authoring-ux-convergence-76

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ai-authoring-ux-convergence-76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make patcher idempotent for existing AI mount marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/ai_authoring_ux_76_patch.py')
          s=p.read_text()
          start=s.index("text = replace_once(\n    text,\n    '<section class=\"rounded-2xl border border-violet-200 bg-white overflow-hidden\">")
          end=s.index("old_toolbar =", start)
          replacement="""if 'data-ai-question-studio=\"${c.id}\"' not in text:\n    text = replace_once(\n        text,\n        '<section class=\"rounded-2xl border border-violet-200 bg-white overflow-hidden\">\\n                      <div class=\"bg-gradient-to-r from-violet-800 to-indigo-800 text-white',\n        '<section data-ai-question-studio=\"${c.id}\" class=\"rounded-2xl border border-violet-200 bg-white overflow-hidden\">\\n                      <div class=\"bg-gradient-to-r from-violet-800 to-indigo-800 text-white',\n        'AI studio mount marker',\n    )\n"""
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - name: Apply guarded patch
        run: python scripts/ai_authoring_ux_76_patch.py
      - name: JavaScript syntax
        run: |
          node --check static/teacher-content-studio-71.js
          node --check static/admin-question-bank.js
          node --check static/admin-question-editor-ui.js
      - name: Focused regressions
        run: |
          python -m unittest tests.test_ai_authoring_ux_convergence_76
          python -m unittest tests.test_phase3_admin_ai_questions
          python -m unittest tests.test_phase3t_admin_question_editor_ui
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/admin-question-bank.js static/admin-question-editor-ui.js static/teacher-content-studio-71.js tests/test_ai_authoring_ux_convergence_76.py
          git diff --cached --quiet && exit 0
          git commit -m 'RC 7.6 converge AI authoring UX and mobile question actions'
          git push origin HEAD:hotfix/ai-authoring-ux-convergence-76
