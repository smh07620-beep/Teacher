name: AI authoring UX 7.6 guarded patcher

on:
  push:
    branches:
      - hotfix/ai-authoring-ux-convergence-76

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ai-authoring-ux-convergence-76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/ai_authoring_ux_76_patch.py
      - name: JavaScript syntax
        run: |
          node --check static/teacher-content-studio-71.js
          node --check static/admin-question-bank.js
          node --check static/admin-question-editor-ui.js
      - name: Focused regressions
        run: |
          python -m unittest tests.test_ai_authoring_ux_convergence_76
          python -m unittest tests.test_phase3_admin_ai_questions
          python -m unittest tests.test_phase3t_admin_question_editor_ui
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/admin-question-bank.js static/admin-question-editor-ui.js static/teacher-content-studio-71.js tests/test_ai_authoring_ux_convergence_76.py
          git diff --cached --quiet && exit 0
          git commit -m 'RC 7.6 converge AI authoring UX and mobile question actions'
          git push origin HEAD:hotfix/ai-authoring-ux-convergence-76
