name: RC 7.8 cleanup helpers

on:
  push:
    branches:
      - hotfix/management-surface-simplification-78

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/management-surface-simplification-78
          fetch-depth: 0
      - name: Restore system-core line endings and apply minimal identity patch
        run: |
          git fetch origin feature/teacher-content-authoring-studio-72
          git checkout origin/feature/teacher-content-authoring-studio-72 -- static/system-core.js
          python - <<'PY'
          from pathlib import Path
          p=Path('static/system-core.js')
          b=p.read_bytes()
          old=b"    set('v573-system-user-name',display);set('v573-system-user-id',empId?`\xe5\xb7\xa5\xe8\x99\x9f ${empId}`:'\xe8\xab\x8b\xe5\x9b\x9e\xe9\xa6\x96\xe9\xa0\x81\xe8\xa8\xad\xe5\xae\x9a');"
          new=b"    set('v573-system-user-name',display);const identityMeta=document.getElementById('v573-system-user-id');if(identityMeta&&identityMeta.dataset.profileHydrated!=='1'&&identityMeta.textContent!=='\xe8\xbc\x89\xe5\x85\xa5\xe8\xba\xab\xe5\x88\x86\xe2\x80\xa6')identityMeta.textContent='\xe8\xbc\x89\xe5\x85\xa5\xe8\xba\xab\xe5\x88\x86\xe2\x80\xa6';"
          assert b.count(old)==1, b.count(old)
          p.write_bytes(b.replace(old,new,1))
          PY
      - name: Remove temporary patch infrastructure
        run: |
          rm -f tools/rc78_patch_system.py tools/rc78_patch_question_bank.py tools/rc78_patch_studio.py tools/rc78_patch_identity.py
          rm -f .github/workflows/rc78-run-patches.yml .github/workflows/rc78-cleanup.yml
      - name: Validate final branch
        run: |
          python -m unittest tests.test_management_surface_simplification_78
          python -m unittest tests.test_content_container_convergence_77
          node --check static/admin-question-bank.js
          node --check static/teacher-content-studio-71.js
          node --check static/system-core.js
          node --check static/training-command-center-71.js
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize RC 7.8 management simplification'
          git push origin HEAD:hotfix/management-surface-simplification-78
