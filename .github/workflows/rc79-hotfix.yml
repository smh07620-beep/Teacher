name: RC 7.9 runtime regression hotfix

on:
  push:
    branches:
      - hotfix/container-runtime-regressions-79

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/container-runtime-regressions-79
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python tools/patch_rc79.py
      - name: Syntax and focused regressions
        run: |
          node --check static/teacher-content-studio-71.js
          node --check static/admin-question-bank.js
          python -m unittest tests.test_rc79_container_runtime_regressions
          python -m unittest tests.test_teacher_content_container_77 tests.test_management_surface_simplification_78
          git diff --check
      - name: Commit product changes and remove patch helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/patch_rc79.py .github/workflows/rc79-hotfix.yml
          git add static/portal-v56.css static/admin-question-bank.js static/teacher-content-studio-71.js tests/test_rc79_container_runtime_regressions.py
          git commit -m 'RC 7.9 fix container runtime regressions'
          git push origin HEAD:hotfix/container-runtime-regressions-79
