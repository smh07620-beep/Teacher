name: Teacher release checks

on:
  push:
    branches:
      - main
      - codex/phase-3-pgy-architecture
      - feature/teacher-content-authoring-studio-72
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teacher_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teacher_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile checks
        run: |
          python -m py_compile *.py
          python -m compileall -q teacher_app tests
      - name: Full Teacher regression and integration suite
        run: python -m unittest discover -s tests -v
      - name: Release, schema and ownership contract tests
        run: |
          python -m unittest discover -s tests -p 'test_release_66.py' -v
          python -m unittest discover -s tests -p 'test_schema_migrations.py' -v
          python -m unittest discover -s tests -p 'test_pre_migration_schema_owners.py' -v
          python -m unittest discover -s tests -p 'test_root_mirror_policy.py' -v
          python -m unittest discover -s tests -p 'test_runtime_question_routes.py' -v
      - name: Browser JavaScript syntax
        run: |
          find static -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find tests -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node tests/test_external_media_behavior_681.js
      - name: Web and worker shell contracts
        run: |
          bash -n run_web.sh
          if command -v pwsh >/dev/null; then pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw run_material_worker.ps1)) | Out-Null"; fi
      - name: Entrypoint, migration, health and security contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          import pgy_app
          from release_contract import ENTRYPOINT, INTERNAL_GENERATION, RELEASE_VERSION, REQUIRED_MIGRATIONS, REQUIRED_RELEASE_MIGRATION, version_file_value
          from teacher_app.common.auth import ROLE_PERMISSIONS
          from teacher_app.factory import create_app
          from teacher_app.maintenance.migrations import MIGRATIONS

          assert pgy_app.create_app is create_app
          assert pgy_app.app.import_name == 'teacher_app.factory'
          assert pgy_app.app.view_functions['teacher_exams.exam_attempt_start'].__module__ == 'teacher_app.exams.routes'
          assert pgy_app.app.view_functions['teacher_auth.login'].__module__ == 'teacher_app.auth.routes'
          assert pgy_app.app.view_functions['training_system'].__module__ == 'teacher_app.frontend.system_page'
          assert pgy_app.app.view_functions['health'].__module__ == 'teacher_app.maintenance.health'
          assert pgy_app.app.extensions.get('pgy_frontend_registered') is True
          assert pgy_app.app.test_client().get('/api/auth/me').get_json() == {'authenticated': False, 'user': None}
          assert 'evaluation.sign' in ROLE_PERMISSIONS['clinical_teacher']
          assert 'evaluation.sign' not in ROLE_PERMISSIONS['education_admin']
          assert 'evaluation.sign' not in ROLE_PERMISSIONS['system_admin']
          assert '0066-additive-rbac-pgy-signing' in REQUIRED_MIGRATIONS
          assert '0067-smart-learning-content' in REQUIRED_MIGRATIONS
          assert '0067-render-worker-shared-staging' in REQUIRED_MIGRATIONS
          assert '0067-b-free-local-worker' in REQUIRED_MIGRATIONS
          assert '0072-course-bundle-idempotency' in REQUIRED_MIGRATIONS
          assert '0073-course-bundle-followups' in REQUIRED_MIGRATIONS
          assert REQUIRED_RELEASE_MIGRATION in REQUIRED_MIGRATIONS
          migrations = [version for version, _fn in MIGRATIONS]
          assert tuple(migrations) == REQUIRED_MIGRATIONS
          assert '0066-additive-rbac-pgy-signing' in migrations
          assert '0071-pgy-learner-audience' in migrations
          assert '0072-course-bundle-idempotency' in migrations
          assert '0073-course-bundle-followups' in migrations
          assert version_file_value() == RELEASE_VERSION
          assert RELEASE_VERSION == '6.8.1'
          assert INTERNAL_GENERATION == '7.9 / RC79'
          assert ENTRYPOINT in Path('run_web.sh').read_text(encoding='utf-8')

          response = pgy_app.app.test_client().get('/health')
          assert response.status_code == 200, response.get_data(as_text=True)
          data = response.get_json()
          assert data['ok'] is True
          assert data['status'] == 'healthy'
          assert data['version'] == RELEASE_VERSION
          assert data['deployment']['provider'] in {'local', 'render'}
          assert set(data['deployment']) == {'provider', 'branch', 'commit'}
          assert data['database']['ok'] is True
          assert data['migrations']['ok'] is True
          assert data['migrations']['missing'] == []
          assert '0066-additive-rbac-pgy-signing' in data['migrations']['applied']
          assert '0067-smart-learning-content' in data['migrations']['applied']
          assert '0071-pgy-learner-audience' in data['migrations']['applied']
          assert '0073-course-bundle-followups' in data['migrations']['applied']
          assert REQUIRED_RELEASE_MIGRATION in data['migrations']['applied']
          PY
      - name: Deployment and compatibility policy checks
        shell: bash
        run: |
          set -euo pipefail

          require_match() {
            local pattern="$1"
            local file="$2"
            local message="$3"
            if ! grep -Eq "$pattern" "$file"; then
              echo "::error::$message"
              exit 1
            fi
          }

          forbid_match() {
            local pattern="$1"
            local file="$2"
            local message="$3"
            if grep -Eq "$pattern" "$file"; then
              echo "::error::$message"
              exit 1
            fi
          }

          require_match 'SECRET_KEY' render.yaml 'Render must declare SECRET_KEY.'
          require_match 'SESSION_COOKIE_SECURE' render.yaml 'Render must keep secure session cookies.'
          require_match 'autoDeployTrigger:[[:space:]]*checksPass' render.yaml 'Render deploys must wait for checksPass.'
          forbid_match 'autoDeployTrigger:[[:space:]]*commit' render.yaml 'Render must not deploy before checks pass.'
          require_match 'AI_DEIDENTIFICATION_ENABLED' render.yaml 'AI de-identification policy is required.'
          require_match 'AI_EXTERNAL_MEDIA_ALLOWED' render.yaml 'AI external-media policy is required.'
          require_match 'UPLOAD_ZIP_MAX_RATIO' render.yaml 'ZIP expansion ratio guard is required.'
          require_match 'GROQ_API_KEY' render.yaml 'Groq secret declaration is required.'
          require_match 'from teacher_app import create_app' pgy_app.py 'WSGI shim must import canonical create_app.'
          require_match 'app = create_app\(\)' pgy_app.py 'WSGI shim must compose the canonical app.'
          forbid_match 'legacy_app' pgy_app.py 'Production WSGI shim must not import legacy_app.'
          forbid_match 'from app import' pgy_app.py 'Production WSGI shim must not import root app.py.'
          require_match 'register_health' teacher_app/factory.py 'Factory must register health routes.'
          require_match 'register_training_audience_71' teacher_app/factory.py 'Factory must register training audience routes.'
          require_match 'register_sensitive_elevation' teacher_app/factory.py 'Factory must register sensitive elevation.'
          require_match 'register_course_bundle_followup_73' teacher_app/factory.py 'Factory must register Course Wizard follow-up routes.'
          forbid_match 'register_pgy_atomic_workflow' pgy_app.py 'PGY workflow registration must not return to the WSGI shim.'
          if [[ -e pgy_atomic.py ]]; then
            echo '::error::Retired pgy_atomic.py must stay removed.'
            exit 1
          fi
          require_match 'from teacher_app.maintenance import migrations as _migrations' schema_migrations.py 'Root migration module must remain a canonical alias.'
          require_match '0066-additive-rbac-pgy-signing' teacher_app/maintenance/migrations.py 'Required PGY migration missing.'
          require_match '0067-smart-learning-content' teacher_app/maintenance/migrations.py 'Required smart-learning migration missing.'
          require_match '0067-render-worker-shared-staging' teacher_app/maintenance/migrations.py 'Required shared-staging migration missing.'
          require_match '0067-b-free-local-worker' teacher_app/maintenance/migrations.py 'Required local-worker migration missing.'
          require_match '0068-external-interactive-media' teacher_app/maintenance/migrations.py 'Required external-media migration missing.'
          require_match 'from teacher_app.frontend import assets as _assets' pgy_frontend.py 'Frontend compatibility module must delegate to canonical assets.'
          require_match 'ASSET_MANIFEST' teacher_app/frontend/assets.py 'Canonical frontend asset manifest is required.'
          require_match 'register_pgy_frontend' teacher_app/frontend/assets.py 'Canonical frontend registration is required.'
          require_match 'type:[[:space:]]*worker' render.yaml 'The dedicated AI background worker must remain declared.'
          require_match 'dockerCommand:[[:space:]]*python -u ai_question_worker\.py' render.yaml 'The Render worker must remain the dedicated AI executor.'
          forbid_match '(dockerCommand|startCommand|command):.*material_worker\.py' render.yaml 'Hospital/local material_worker.py must never run as a Render service.'
          require_match 'MATERIAL_DIRECT_UPLOAD_ENABLED' render.yaml 'Direct upload setting is required.'
          require_match 'MEGA_WEB_READ_TIMEOUT_SECONDS' render.yaml 'MEGA Web timeout setting is required.'
          require_match 'GUNICORN_TIMEOUT' render.yaml 'Gunicorn timeout setting is required.'
          require_match 'MATERIAL_WORKER_TOKEN' render.yaml 'Worker API token declaration is required.'
          forbid_match 'material_worker\.py' run_web.sh 'The Web process must not supervise material_worker.py.'
          [[ -f ARCHITECTURE.md ]] || { echo '::error::ARCHITECTURE.md is required.'; exit 1; }
          [[ -f docs/archive/ARCHITECTURE_HISTORY.md ]] || { echo '::error::Architecture history is required.'; exit 1; }
          require_match 'Teacher 6\.7' docs/archive/ARCHITECTURE_HISTORY.md 'Architecture history must retain Teacher 6.7.'
          require_match 'Root freeze policy' ARCHITECTURE.md 'Current architecture must retain the root freeze policy.'
          require_match 'system-admin\.js.*legacy compatibility bundle' ARCHITECTURE.md 'Frontend ownership contract is missing.'
      - name: Real PostgreSQL fresh-bootstrap and persistence smoke
        env:
          TEACHER_POSTGRES_CI: '1'
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teacher_ci
          SECRET_KEY: teacher-ci-postgres-secret-key-0123456789abcdef
          PRODUCTION_REQUIRE_SECRET: 'false'
          SESSION_COOKIE_SECURE: 'false'
          MATERIAL_STORAGE: /tmp/teacher-postgres-materials
        run: python -m unittest tests.test_postgres_integration_ci -v
