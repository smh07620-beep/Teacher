name: Teacher release checks

on:
  push:
    branches:
      - main
      - codex/phase-3-pgy-architecture
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3' 'Pillow>=10.4,<12.0'
      - name: Python compile checks
        run: |
          python -m py_compile \
            app.py pgy_app.py pgy_frontend.py pgy_workflow.py pgy_atomic.py \
            pgy_signing_66.py multi_role_66.py exam_integrity.py \
            production_hardening.py schema_migrations.py backup_restore.py \
            upload_hardening.py ai_privacy.py health_65.py material_worker.py \
            media_processing_67.py smart_learning_67.py free_worker_67.py atlas_70.py \
            external_media_68.py admin_elevation_68.py sensitive_elevation_69.py \
            question_bank_68.py release_contract.py
          python -m compileall -q teacher_app tests
      - name: Full Teacher regression and integration suite
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax
        run: |
          node --check static/shared-core.js
          node --check static/pgy-workflow.js
          node --check static/roles-signing-66.js
          node --check static/exam-integrity.js
          node --check static/review-links-66.js
          node --check static/maintenance-64.js
          node --check static/smart-learning-67.js
          node --check static/assessment-681.js
          node --check static/course-wizard-681.js
          node --check static/external-material-681.js
          node --check static/sensitive-elevation-69.js
          node --check static/workspace-shell-70.js
          node --check static/worker-status-70.js
          node --check static/atlas-70.js
          node --check static/atlas-docx-wizard-70.js
          node --check static/admin-ai-questions.js
          node --check static/admin-exam-settings.js
          node --check static/admin-doc-templates.js
          node --check static/admin-pgy-assessments.js
          node --check static/admin-external-media.js
          node --check static/admin-results-export.js
          node tests/test_external_media_behavior_681.js
      - name: Web and worker shell contracts
        run: |
          bash -n run_web.sh
          if command -v pwsh >/dev/null; then pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw run_material_worker.ps1)) | Out-Null"; fi
      - name: Entrypoint, migration, health and security contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          import pgy_app
          from health_65 import REQUIRED_MIGRATIONS
          from release_contract import ENTRYPOINT, RELEASE_VERSION, REQUIRED_RELEASE_MIGRATION, version_file_value
          from teacher_app.common.auth import ROLE_PERMISSIONS

          assert pgy_app.app.view_functions['exam_attempt_start'].__module__ == 'teacher_app.exams.routes'
          assert pgy_app.legacy_app.auth_routes.login.__module__ == 'teacher_app.auth.routes'
          assert pgy_app.app.test_client().get('/api/auth/me').get_json() == {'authenticated': False, 'user': None}
          assert 'evaluation.sign' in ROLE_PERMISSIONS['clinical_teacher']
          assert 'evaluation.sign' not in ROLE_PERMISSIONS['education_admin']
          assert 'evaluation.sign' not in ROLE_PERMISSIONS['system_admin']
          assert '0066-additive-rbac-pgy-signing' in REQUIRED_MIGRATIONS
          assert '0067-smart-learning-content' in REQUIRED_MIGRATIONS
          assert '0067-render-worker-shared-staging' in REQUIRED_MIGRATIONS
          assert '0067-b-free-local-worker' in REQUIRED_MIGRATIONS
          assert REQUIRED_RELEASE_MIGRATION in REQUIRED_MIGRATIONS
          assert '0066-additive-rbac-pgy-signing' in [version for version, _fn in __import__('schema_migrations').MIGRATIONS]
          assert version_file_value() == RELEASE_VERSION
          assert ENTRYPOINT in Path('run_web.sh').read_text(encoding='utf-8')

          response = pgy_app.app.test_client().get('/health')
          assert response.status_code == 200, response.get_data(as_text=True)
          data = response.get_json()
          assert data['ok'] is True
          assert data['status'] == 'healthy'
          assert data['version'] == RELEASE_VERSION
          assert data['database']['ok'] is True
          assert data['migrations']['ok'] is True
          assert data['migrations']['missing'] == []
          assert '0066-additive-rbac-pgy-signing' in data['migrations']['applied']
          assert '0067-smart-learning-content' in data['migrations']['applied']
          assert REQUIRED_RELEASE_MIGRATION in data['migrations']['applied']
          PY
      - name: Deployment and compatibility policy checks
        run: |
          grep -q 'SECRET_KEY' render.yaml
          grep -q 'SESSION_COOKIE_SECURE' render.yaml
          grep -q 'AI_DEIDENTIFICATION_ENABLED' render.yaml
          grep -q 'AI_EXTERNAL_MEDIA_ALLOWED' render.yaml
          grep -q 'UPLOAD_ZIP_MAX_RATIO' render.yaml
          grep -q 'GROQ_API_KEY' render.yaml
          grep -q 'register_health' pgy_app.py
          grep -q 'register_sensitive_elevation_69' pgy_app.py
          grep -q '0066-additive-rbac-pgy-signing' schema_migrations.py
          grep -q '0067-smart-learning-content' schema_migrations.py
          grep -q '0067-render-worker-shared-staging' schema_migrations.py
          grep -q '0067-b-free-local-worker' schema_migrations.py
          grep -q '0068-external-interactive-media' schema_migrations.py
          ! grep -q 'type: worker' render.yaml
          grep -q 'MATERIAL_DIRECT_UPLOAD_ENABLED' render.yaml
          grep -q 'MATERIAL_WORKER_TOKEN' render.yaml
          ! grep -q 'material_worker.py' run_web.sh
          grep -q 'Teacher 6.7' ARCHITECTURE_6_7.md
          test -f ARCHITECTURE_ROOT_MIRROR_CLEANUP.md
          grep -q 'Root freeze policy' ARCHITECTURE_ROOT_MIRROR_CLEANUP.md
