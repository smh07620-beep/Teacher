name: Teacher 6.3 security checks

on:
  push:
    branches:
      - codex/phase-3-pgy-architecture
      - codex/phase-3-pgy-workflow-ui
  pull_request:
    paths:
      - 'pgy_*.py'
      - 'pgy_atomic.py'
      - 'exam_integrity.py'
      - 'production_hardening.py'
      - 'static/pgy-workflow.*'
      - 'static/exam-integrity.js'
      - 'tests/test_pgy_workflow.py'
      - 'tests/test_exam_integrity.py'
      - 'render.yaml'
      - '.github/workflows/phase3-pgy-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile pgy_app.py pgy_frontend.py pgy_workflow.py pgy_atomic.py exam_integrity.py production_hardening.py
      - name: RBAC, workflow and exam integrity unit tests
        run: python -m unittest tests.test_rbac_roles tests.test_pgy_workflow tests.test_exam_integrity -v
      - name: Browser JavaScript syntax
        run: |
          node --check static/pgy-workflow.js
          node --check static/exam-integrity.js
      - name: Deployment entrypoint check
        run: |
          grep -q 'pgy_app:app' run_web.sh
          grep -q 'SECRET_KEY' render.yaml
          grep -q 'SESSION_COOKIE_SECURE' render.yaml
      - name: Build uploadable Teacher 6.3.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        run: zip -qr Teacher-6.3.0-secure-exam.zip . -x '.git/*' 'Teacher-6.3.0-secure-exam.zip'
      - name: Upload Teacher 6.3.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-6.3.0-secure-exam
          path: Teacher-6.3.0-secure-exam.zip
          if-no-files-found: error
          retention-days: 14
