name: Teacher 6.5 architecture checks

on:
  push:
    branches:
      - codex/phase-3-pgy-architecture
      - codex/phase-3-pgy-workflow-ui
  pull_request:
    paths:
      - 'app.py'
      - 'pgy_*.py'
      - 'pgy_atomic.py'
      - 'exam_integrity.py'
      - 'production_hardening.py'
      - 'schema_migrations.py'
      - 'backup_restore.py'
      - 'upload_hardening.py'
      - 'ai_privacy.py'
      - 'teacher_app/**'
      - 'static/pgy-workflow.*'
      - 'static/exam-integrity.js'
      - 'static/maintenance-64.js'
      - 'tests/**'
      - 'render.yaml'
      - 'run_web.sh'
      - 'VERSION'
      - 'DATA_PROTECTION_6_4.md'
      - '.github/workflows/phase3-pgy-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'Flask>=3,<4' 'requests>=2.32,<3'
      - name: Python syntax and modular package compile
        run: |
          python -m py_compile \
            app.py pgy_app.py pgy_frontend.py pgy_workflow.py pgy_atomic.py \
            exam_integrity.py production_hardening.py schema_migrations.py \
            backup_restore.py upload_hardening.py ai_privacy.py
          python -m compileall -q teacher_app
      - name: Auth, RBAC and all Milestone 1-4 / 6.4 regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax
        run: |
          node --check static/pgy-workflow.js
          node --check static/exam-integrity.js
          node --check static/maintenance-64.js
      - name: Production entrypoint uses modular exam and auth adapters
        run: >-
          python -c "import pgy_app;
          assert pgy_app.app.view_functions['exam_attempt_start'].__module__ == 'teacher_app.exams.routes';
          assert pgy_app.legacy_app.auth_routes.login.__module__ == 'teacher_app.auth.routes';
          assert pgy_app.app.test_client().get('/api/auth/me').get_json() == {'authenticated': False, 'user': None}"
      - name: Deployment, compatibility and 6.4 runtime policy checks
        run: |
          grep -q 'pgy_app:app' run_web.sh
          grep -q 'from teacher_app.pgy import service as pgy_service' pgy_atomic.py
          grep -q 'from teacher_app.exams.routes import register_legacy_exam_routes' exam_integrity.py
          grep -q 'SECRET_KEY' render.yaml
          grep -q 'SESSION_COOKIE_SECURE' render.yaml
          grep -q 'AI_DEIDENTIFICATION_ENABLED' render.yaml
          grep -q 'AI_EXTERNAL_MEDIA_ALLOWED' render.yaml
          grep -q 'UPLOAD_ZIP_MAX_RATIO' render.yaml
          grep -q 'GROQ_API_KEY' render.yaml
          test "$(cat VERSION)" = "6.4.0"
      - name: Build uploadable Teacher 6.4.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        run: zip -qr Teacher-6.4.0-data-protection.zip . -x '.git/*' 'Teacher-6.4.0-data-protection.zip' '__pycache__/*'
      - name: Upload Teacher 6.4.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-6.4.0-data-protection
          path: Teacher-6.4.0-data-protection.zip
          if-no-files-found: error
          retention-days: 14
