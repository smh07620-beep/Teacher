name: Phase 3 PGY checks

on:
  push:
    branches:
      - codex/phase-3-pgy-architecture
      - codex/phase-3-pgy-workflow-ui
  pull_request:
    paths:
      - 'pgy_*.py'
      - 'static/pgy-workflow.*'
      - 'tests/test_pgy_workflow.py'
      - '.github/workflows/phase3-pgy-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile pgy_app.py pgy_frontend.py pgy_workflow.py
      - name: RBAC and workflow unit tests
        run: python -m unittest tests.test_rbac_roles tests.test_pgy_workflow -v
      - name: Browser JavaScript syntax
        run: node --check static/pgy-workflow.js
      - name: Deployment entrypoint check
        run: grep -q 'pgy_app:app' run_web.sh
      - name: Build uploadable Teacher 6.2.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        run: zip -qr Teacher-6.2.0-PGY-workflow.zip . -x '.git/*' 'Teacher-6.2.0-PGY-workflow.zip'
      - name: Upload Teacher 6.2.0 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase-3-pgy-architecture'
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-6.2.0-PGY-workflow
          path: Teacher-6.2.0-PGY-workflow.zip
          if-no-files-found: error
          retention-days: 14
