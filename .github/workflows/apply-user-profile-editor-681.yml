name: Apply user profile editor 6.8.1

on:
  push:
    branches:
      - fix/user-profile-editor-681

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-profile-editor-681
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch existing account profile editor
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('static/system-admin.js')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"async function renderAdminUserAccounts\(\)\{.*?\nasync function renderAdminPeople\(force=false\)\{",
              re.S,
          )
          replacement = r'''let adminUserAccountsCache=[];
          const ADMIN_PROFILE_COMMON_TAGS=['品管','臨床教師','POCT','儀器管理','教學負責'];
          const ADMIN_USER_ROLE_LABELS={student:'學員',clinical_teacher:'臨床教師',group_leader:'組長',education_admin:'教學管理者',system_admin:'系統管理者',auditor:'稽核／唯讀',learner:'學員',teacher:'臨床教師',manager:'教學管理者'};
          const ADMIN_USER_AREA_LABELS={internal:'院內',pgy:'PGY'};
          function adminProfileTags(value){
              const raw=Array.isArray(value)?value:String(value||'').split(/[,，、;；\n]+/);const out=[];
              raw.forEach(item=>{const tag=String(item||'').trim();if(tag&&!out.includes(tag))out.push(tag);});return out.slice(0,12);
          }
          function adminUserRoleSummary(u){
              const primary=ADMIN_USER_ROLE_LABELS[u?.role]||String(u?.role||'—'),roles=Array.isArray(u?.roles)?u.roles:[];
              const extras=roles.filter(r=>r&&r!==u?.role).map(r=>ADMIN_USER_ROLE_LABELS[r]||r);
              return extras.length?`${primary}（另有：${extras.join('、')}）`:primary;
          }
          function ensureAdminUserEditor(){
              if(document.getElementById('admin-user-editor-modal'))return;
              const common=ADMIN_PROFILE_COMMON_TAGS.map(tag=>`<label class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs text-slate-700"><input type="checkbox" data-admin-profile-tag value="${escapeHtml(tag)}" onchange="adminSetProfileTag(this.value,this.checked)" class="rounded">${escapeHtml(tag)}</label>`).join('');
              document.body.insertAdjacentHTML('beforeend',`<div id="admin-user-editor-modal" class="hidden fixed inset-0 z-[120] bg-slate-950/50 p-4 overflow-y-auto" onclick="if(event.target===this)closeAdminUserEditor()"><div class="mx-auto mt-10 max-w-2xl rounded-2xl bg-white shadow-2xl border border-slate-200 overflow-hidden"><div class="flex items-start justify-between gap-3 border-b border-slate-100 px-5 py-4"><div><h3 class="font-black text-slate-900">👤 編輯人員資料</h3><p class="mt-1 text-xs text-slate-500">主要職稱與額外職責只作人員資料／畫面顯示，不會變更系統角色或權限。</p></div><button type="button" onclick="closeAdminUserEditor()" class="text-slate-400 hover:text-slate-700 text-xl">×</button></div><div class="p-5 space-y-4"><input id="admin-user-editor-username" type="hidden"><div class="grid sm:grid-cols-2 gap-3"><div class="rounded-xl bg-slate-50 border border-slate-200 p-3"><div class="text-[11px] font-bold text-slate-500">帳號</div><div id="admin-user-editor-account" class="mt-1 font-mono text-sm font-bold text-slate-900"></div></div><div class="rounded-xl bg-slate-50 border border-slate-200 p-3"><div class="text-[11px] font-bold text-slate-500">系統角色／權限</div><div id="admin-user-editor-role" class="mt-1 text-sm font-bold text-slate-900"></div></div></div><div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[11px] text-amber-800">🔒 系統角色與組別權限不在此區變更；職稱／職責標籤不參與 RBAC 判斷。</div><div class="grid sm:grid-cols-2 gap-3"><label class="text-xs font-bold text-slate-600">姓名<input id="admin-user-editor-name" class="learning-input mt-1" maxlength="100"></label><label class="text-xs font-bold text-slate-600">工號<input id="admin-user-editor-empid" class="learning-input mt-1" maxlength="100"></label></div><div class="grid sm:grid-cols-2 gap-3"><div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><div class="text-[11px] font-bold text-slate-500">預設訓練區／組別</div><div id="admin-user-editor-scope" class="mt-1 text-sm font-bold text-slate-800"></div><div class="mt-1 text-[10px] text-slate-500">這是權限範圍資訊，本視窗只讀。</div></div><label class="text-xs font-bold text-slate-600">主要職稱<input id="admin-user-editor-professional-title" list="admin-professional-title-options" class="learning-input mt-1" maxlength="100" placeholder="例如：品管醫檢師"><datalist id="admin-professional-title-options"><option value="醫檢師"><option value="資深醫檢師"><option value="品管醫檢師"><option value="臨床教師"><option value="組長"></datalist><span class="block mt-1 text-[10px] font-normal text-slate-400">可直接輸入自訂職稱。</span></label></div><div><label class="text-xs font-bold text-slate-600">額外職責</label><div class="mt-2 flex flex-wrap gap-2">${common}</div><input id="admin-user-editor-responsibility-tags" oninput="adminSyncProfileTagChecks()" class="learning-input mt-2" placeholder="可輸入其他職責，以逗號分隔"><p class="mt-1 text-[10px] text-slate-400">最多 12 個標籤；例如：品管、POCT、儀器管理、教學負責。</p></div><div id="admin-user-editor-status" class="text-xs text-slate-500"></div></div><div class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50 px-5 py-4"><button type="button" onclick="closeAdminUserEditor()" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-600">取消</button><button id="admin-user-editor-save" type="button" onclick="saveAdminUserEditor()" class="rounded-xl bg-teal-700 hover:bg-teal-600 px-4 py-2 text-sm font-bold text-white">💾 儲存人員資料</button></div></div></div>`);
          }
          function adminSyncProfileTagChecks(){
              const tags=adminProfileTags(document.getElementById('admin-user-editor-responsibility-tags')?.value||'');
              document.querySelectorAll('#admin-user-editor-modal [data-admin-profile-tag]').forEach(cb=>{cb.checked=tags.includes(cb.value);});
          }
          function adminSetProfileTag(tag,checked){
              const input=document.getElementById('admin-user-editor-responsibility-tags');if(!input)return;const tags=adminProfileTags(input.value),idx=tags.indexOf(tag);
              if(checked&&idx<0)tags.push(tag);if(!checked&&idx>=0)tags.splice(idx,1);input.value=tags.slice(0,12).join('、');adminSyncProfileTagChecks();
          }
          function openAdminUserEditor(username){
              const u=adminUserAccountsCache.find(row=>String(row.username)===String(username));if(!u){alert('找不到帳號資料，請重新整理人員清單。');return;}
              ensureAdminUserEditor();document.getElementById('admin-user-editor-username').value=u.username||'';document.getElementById('admin-user-editor-account').textContent=`${u.username||''}｜${u.name||''}`;document.getElementById('admin-user-editor-role').textContent=adminUserRoleSummary(u);document.getElementById('admin-user-editor-name').value=u.name||'';document.getElementById('admin-user-editor-empid').value=u.empId||'';document.getElementById('admin-user-editor-scope').textContent=`${ADMIN_USER_AREA_LABELS[u.preferredArea]||u.preferredArea||'—'} · ${(GROUPS[u.preferredGroup]||GROUPS.grpBio).name}`;document.getElementById('admin-user-editor-professional-title').value=u.professionalTitle||'';document.getElementById('admin-user-editor-responsibility-tags').value=adminProfileTags(u.responsibilityTags).join('、');document.getElementById('admin-user-editor-status').textContent='';adminSyncProfileTagChecks();document.getElementById('admin-user-editor-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('admin-user-editor-professional-title')?.focus(),0);
          }
          function closeAdminUserEditor(){document.getElementById('admin-user-editor-modal')?.classList.add('hidden');}
          async function saveAdminUserEditor(){
              const username=document.getElementById('admin-user-editor-username')?.value||'',name=document.getElementById('admin-user-editor-name')?.value.trim()||'',empId=document.getElementById('admin-user-editor-empid')?.value.trim()||'',professionalTitle=document.getElementById('admin-user-editor-professional-title')?.value.trim()||'',responsibilityTags=adminProfileTags(document.getElementById('admin-user-editor-responsibility-tags')?.value||''),status=document.getElementById('admin-user-editor-status'),btn=document.getElementById('admin-user-editor-save');
              if(!username||!name||!empId){if(status)status.textContent='❌ 姓名與工號不可空白。';return;}
              const key=await getAdminKey();if(!key)return;const payload={name,empId,professionalTitle,responsibilityTags};
              try{if(btn)btn.disabled=true;if(status)status.textContent='⏳ 儲存人員資料中…';const r=await fetch(`/api/users/${encodeURIComponent(username)}`,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'儲存失敗');if(status)status.textContent='✅ 人員資料已儲存；系統角色與權限未變更。';await renderAdminUserAccounts();setTimeout(()=>closeAdminUserEditor(),450);}catch(e){if(status)status.textContent=`❌ ${e.message}`;}finally{if(btn)btn.disabled=false;}
          }
          async function renderAdminUserAccounts(){
              const body=document.getElementById('admin-user-accounts-body'),status=document.getElementById('admin-user-status');if(!body)return;body.innerHTML='<tr><td colspan="6" class="p-5 text-center text-slate-400">讀取帳號中…</td></tr>';
              const key=await getAdminKey();if(!key)return;
              try{const r=await fetch('/api/users',{headers:{'X-Admin-Key':key},cache:'no-store'}),rows=await r.json().catch(()=>[]);if(!r.ok)throw new Error(rows.error||'帳號讀取失敗');adminUserAccountsCache=Array.isArray(rows)?rows:[];
                  body.innerHTML=adminUserAccountsCache.length?adminUserAccountsCache.map(u=>{const tags=adminProfileTags(u.responsibilityTags),profile=`<div class="mt-1 text-[11px] text-slate-500">${u.professionalTitle?`職稱：${escapeHtml(u.professionalTitle)}`:'職稱：未設定'}</div>${tags.length?`<div class="mt-1 flex flex-wrap gap-1">${tags.map(tag=>`<span class="rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-bold text-indigo-700">${escapeHtml(tag)}</span>`).join('')}</div>`:''}`;return `<tr class="${u.active?'':'opacity-55'}"><td class="p-3"><b>${escapeHtml(u.username)}</b><div class="text-slate-500 mt-1">${escapeHtml(u.name)}</div></td><td class="p-3 font-mono">${escapeHtml(u.empId)}</td><td class="p-3"><div>${escapeHtml(adminUserRoleSummary(u))}</div>${profile}</td><td class="p-3">${ADMIN_USER_AREA_LABELS[u.preferredArea]||''} · ${escapeHtml((GROUPS[u.preferredGroup]||GROUPS.grpBio).name)}</td><td class="p-3 text-slate-500">${escapeHtml((u.lastLoginAt||'尚未登入').slice(0,16).replace('T',' '))}</td><td class="p-3"><div class="flex flex-wrap gap-1.5"><button data-username="${escapeHtml(u.username)}" onclick="openAdminUserEditor(this.dataset.username)" class="text-[11px] border border-teal-200 bg-teal-50 text-teal-800 px-2.5 py-1.5 rounded-lg font-bold">編輯人員資料</button><button data-username="${escapeHtml(u.username)}" onclick="resetAdminUserPassword(this.dataset.username)" class="text-[11px] border border-slate-300 bg-white px-2.5 py-1.5 rounded-lg">重設密碼</button><button data-username="${escapeHtml(u.username)}" onclick="toggleAdminUserAccount(this.dataset.username,${u.active?'false':'true'})" class="text-[11px] ${u.active?'text-rose-600 border-rose-200':'text-emerald-700 border-emerald-200'} border bg-white px-2.5 py-1.5 rounded-lg">${u.active?'停用':'啟用'}</button></div></td></tr>`;}).join(''):'<tr><td colspan="6" class="p-5 text-center text-slate-400">尚未建立登入帳號。請使用上方表單建立第一個帳號。</td></tr>';if(status)status.textContent=`共 ${adminUserAccountsCache.length} 個帳號；「主要職稱／額外職責」與系統角色權限分開管理。`;
              }catch(e){adminUserAccountsCache=[];body.innerHTML=`<tr><td colspan="6" class="p-5 text-center text-rose-600">❌ ${escapeHtml(e.message)}</td></tr>`;}
          }
          async function createAdminUserAccount(){
              const status=document.getElementById('admin-user-status'),key=await getAdminKey();if(!key)return;const payload={username:document.getElementById('admin-user-username')?.value||'',password:document.getElementById('admin-user-password')?.value||'',name:document.getElementById('admin-user-name')?.value||'',empId:document.getElementById('admin-user-empid')?.value||'',role:document.getElementById('admin-user-role')?.value||'student',preferredArea:document.getElementById('admin-user-area')?.value||'internal',preferredGroup:document.getElementById('admin-user-group')?.value||'grpBio',professionalTitle:document.getElementById('admin-user-professional-title')?.value||'',responsibilityTags:adminProfileTags(document.getElementById('admin-user-responsibility-tags')?.value||'')};status.textContent='⏳ 建立帳號中…';
              const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok){status.textContent='❌ '+(d.error||'建立失敗');return;}['admin-user-username','admin-user-password','admin-user-name','admin-user-empid','admin-user-professional-title','admin-user-responsibility-tags'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});status.textContent=`✅ 已建立 ${d.user.name}（${d.user.username}）`;await renderAdminUserAccounts();
          }
          async function resetAdminUserPassword(username){const password=prompt(`請輸入「${username}」的新密碼（至少 4 碼）：`);if(password===null)return;const key=await getAdminKey();if(!key)return;const r=await fetch(`/api/users/${encodeURIComponent(username)}`,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({password})}),d=await r.json().catch(()=>({}));alert(r.ok?'密碼已重設，該帳號需重新登入。':(d.error||'重設失敗'));if(r.ok)await renderAdminUserAccounts();}
          async function toggleAdminUserAccount(username,active){const key=await getAdminKey();if(!key)return;const r=await fetch(`/api/users/${encodeURIComponent(username)}`,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({active})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'更新失敗');return;}await renderAdminUserAccounts();}

          async function renderAdminPeople(force=false){'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'account UI block replacement count={count}')
          path.write_text(updated, encoding='utf-8')

          test = Path('tests/test_user_profile_editor_681.py')
          test.write_text(r'''import json
          import unittest
          from pathlib import Path

          from multi_role_66 import register_multi_role_66
          from tests.auth_support import AuthFixture


          class UserProfileEditorFrontend681Tests(unittest.TestCase):
              def test_existing_account_editor_exposes_profile_metadata_without_role_mutation(self):
                  source = Path(__file__).parents[1].joinpath('static', 'system-admin.js').read_text(encoding='utf-8')
                  self.assertIn('function openAdminUserEditor(username)', source)
                  self.assertIn('admin-user-editor-professional-title', source)
                  self.assertIn('admin-user-editor-responsibility-tags', source)
                  self.assertIn('professionalTitle', source)
                  self.assertIn('responsibilityTags', source)
                  start = source.index('async function saveAdminUserEditor()')
                  end = source.index('async function renderAdminUserAccounts()', start)
                  save = source[start:end]
                  self.assertIn('const payload={name,empId,professionalTitle,responsibilityTags}', save)
                  self.assertNotIn('role:', save)
                  self.assertNotIn('roles:', save)
                  self.assertIn('職稱／職責標籤不參與 RBAC 判斷', source)

              def test_account_list_shows_profile_metadata_and_edit_action(self):
                  source = Path(__file__).parents[1].joinpath('static', 'system-admin.js').read_text(encoding='utf-8')
                  self.assertIn('編輯人員資料', source)
                  self.assertIn('u.professionalTitle', source)
                  self.assertIn('adminProfileTags(u.responsibilityTags)', source)


          class UserProfileEditorApi681Tests(AuthFixture):
              def setUp(self):
                  super().setUp()
                  conn, _ = self.connect()
                  try:
                      conn.execute("ALTER TABLE user_accounts ADD COLUMN professional_title TEXT NOT NULL DEFAULT ''")
                      conn.execute("ALTER TABLE user_accounts ADD COLUMN responsibility_tags TEXT NOT NULL DEFAULT '[]'")
                  finally:
                      conn.close()
                  register_multi_role_66(self.base)
                  self.sql(
                      "UPDATE user_accounts SET role=?, roles_json=? WHERE username=?",
                      ('clinical_teacher', json.dumps(['clinical_teacher', 'group_leader']), 'teacher1'),
                  )

              def test_profile_patch_roundtrips_without_changing_roles_or_session_version(self):
                  before = dict(self.sql(
                      "SELECT role,roles_json,session_version FROM user_accounts WHERE username=?",
                      ('teacher1',),
                  )[0])
                  response = self.client.patch(
                      '/api/users/teacher1',
                      json={
                          'name': 'Teacher One',
                          'empId': 'E001',
                          'professionalTitle': '品管醫檢師',
                          'responsibilityTags': ['品管', '臨床教師', 'POCT'],
                      },
                  )
                  self.assertEqual(response.status_code, 200, response.get_data(as_text=True))
                  user = response.get_json()['user']
                  self.assertEqual(user['professionalTitle'], '品管醫檢師')
                  self.assertEqual(user['responsibilityTags'], ['品管', '臨床教師', 'POCT'])
                  self.assertEqual(user['role'], 'clinical_teacher')
                  self.assertEqual(user['roles'], ['clinical_teacher', 'group_leader'])
                  after = dict(self.sql(
                      "SELECT role,roles_json,session_version,professional_title,responsibility_tags FROM user_accounts WHERE username=?",
                      ('teacher1',),
                  )[0])
                  self.assertEqual(after['role'], before['role'])
                  self.assertEqual(json.loads(after['roles_json']), json.loads(before['roles_json']))
                  self.assertEqual(after['session_version'], before['session_version'])
                  self.assertEqual(after['professional_title'], '品管醫檢師')
                  self.assertEqual(json.loads(after['responsibility_tags']), ['品管', '臨床教師', 'POCT'])


          if __name__ == '__main__':
              unittest.main()
          ''', encoding='utf-8')
      - name: Sanity check generated changes
        run: |
          python -m py_compile tests/test_user_profile_editor_681.py
          node --check static/system-admin.js
          git diff --check
          git diff -- static/system-admin.js tests/test_user_profile_editor_681.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/system-admin.js tests/test_user_profile_editor_681.py
          git commit -m "Expose profile title and responsibility tags in account editor"
          git push origin HEAD:fix/user-profile-editor-681
