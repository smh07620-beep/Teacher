name: Diagnose material version 0084

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/material-version-retraining-84'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - learning
          - dashboard
          - materials
          - migrations
          - release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run diagnostic group
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            learning)
              python -m unittest discover -s tests -p 'test_*learning*.py' -v
              python -m unittest discover -s tests -p 'test_smart*.py' -v
              ;;
            dashboard)
              python -m unittest discover -s tests -p 'test_*dashboard*.py' -v
              python -m unittest discover -s tests -p 'test_*command_center*.py' -v
              ;;
            materials)
              python -m unittest discover -s tests -p 'test_*material*.py' -v
              ;;
            migrations)
              python -m unittest discover -s tests -p 'test_*migration*.py' -v
              python -m unittest discover -s tests -p 'test_*schema*.py' -v
              ;;
            release)
              python -m unittest discover -s tests -p 'test_release*.py' -v
              python -m unittest discover -s tests -p 'test_*ownership*.py' -v
              ;;
          esac
