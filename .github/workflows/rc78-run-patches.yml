name: RC 7.8 run guarded patches

on:
  push:
    branches:
      - hotfix/management-surface-simplification-78

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/management-surface-simplification-78
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patches
        run: |
          python tools/rc78_patch_system.py
          python tools/rc78_patch_question_bank.py
          python tools/rc78_patch_studio.py
          python tools/rc78_patch_identity.py
      - name: Validate focused regressions
        run: |
          python -m unittest tests.test_management_surface_simplification_78
          python -m unittest tests.test_content_container_convergence_77
          node --check static/admin-question-bank.js
          node --check static/teacher-content-studio-71.js
          node --check static/system-core.js
          node --check static/training-command-center-71.js
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static tests/test_management_surface_simplification_78.py
          git diff --cached --quiet && exit 0
          git commit -m 'RC 7.8 simplify management surfaces'
          git push origin HEAD:hotfix/management-surface-simplification-78
