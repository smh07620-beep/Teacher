services:
  - type: web
    name: biochemical-training-exam
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PRODUCTION_REQUIRE_SECRET
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "12"
      - key: LOGIN_RATE_LIMIT_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: CSRF_ORIGIN_CHECK
        value: "true"
      - key: CSP_ENFORCE
        value: "false"
      - key: MATERIAL_STORAGE_BACKEND
        value: mega
      - key: STORAGE_FAILOVER_ON_FULL
        value: "true"
      - key: STORAGE_FALLBACK_BACKEND
        value: gdrive
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: MEGA_EMAIL
        sync: false
      - key: MEGA_PASSWORD
        sync: false
      - key: MEGA_ROOT_FOLDER
        value: smh-teaching-materials
      - key: MEGA_STORAGE_LIMIT_GB
        value: "18.0"
      - key: MEGA_SESSION_CACHE_SECONDS
        value: "1800"
      - key: MEGACMD_HOME
        value: /tmp/megacmd-home
      - key: MEGACMD_TIMEOUT_SECONDS
        value: "300"
      - key: FREE_ONLY_MODE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "250"
      - key: UPLOAD_ZIP_MAX_FILES
        value: "2000"
      - key: UPLOAD_ZIP_MAX_EXPANDED_MB
        value: "1024"
      - key: UPLOAD_ZIP_MAX_RATIO
        value: "200"
      - key: BACKUP_MAX_UPLOAD_MB
        value: "100"
      - key: BACKUP_MAX_EXPANDED_MB
        value: "500"
      - key: MATERIAL_SLIDE_FORMAT
        value: webp
      - key: MATERIAL_WEBP_QUALITY
        value: "88"
      - key: MATERIAL_SINGLE_PREVIEW
        value: "true"
      - key: MATERIAL_PREVIEW_OPTIMIZE
        value: "true"
      - key: MATERIAL_PREVIEW_CACHE_MB
        value: "512"
      - key: MATERIAL_PREVIEW_CACHE_TTL_SECONDS
        value: "21600"
      - key: MATERIAL_PDF_LINEARIZE
        value: "true"
      - key: MATERIAL_BACKGROUND_JOBS
        value: "true"
      - key: MATERIAL_JOB_MAX_ATTEMPTS
        value: "3"
      - key: MATERIAL_JOB_STALE_SECONDS
        value: "1800"
      - key: MATERIAL_JOB_RETENTION_HOURS
        value: "72"
      - key: MATERIAL_JOB_POLL_SECONDS
        value: "2"
      - key: MAX_DOC_TEMPLATE_MB
        value: "20"
      - key: MAX_PGY_TEMPLATE_MB
        value: "20"
      - key: AI_EXTERNAL_PROCESSING_ENABLED
        value: "true"
      - key: AI_DEIDENTIFICATION_ENABLED
        value: "true"
      - key: AI_EXTERNAL_MEDIA_ALLOWED
        value: "false"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
      - key: AI_SOURCE_MAX_CHARS
        value: "50000"
      - key: AI_MAX_QUESTIONS
        value: "15"
      - key: AI_MEDIA_MAX_MB
        value: "250"
      - key: AI_MAX_MATERIALS
        value: "4"
      - key: AI_VIDEO_FRAME_COUNT
        value: "3"
      - key: MATERIAL_STORAGE
        value: /var/data/materials
